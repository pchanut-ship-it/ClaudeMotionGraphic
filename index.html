<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร่องรอยลับในข้อความ AI</title>
<style>
  @font-face { font-family: "Prompt"; font-weight: 500; font-display: block;
    src: url(assets/fonts/prompt-thai-500-normal.woff2) format("woff2");
    unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "Prompt"; font-weight: 500; font-display: block;
    src: url(assets/fonts/prompt-latin-500-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Prompt"; font-weight: 600; font-display: block;
    src: url(assets/fonts/prompt-thai-600-normal.woff2) format("woff2");
    unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "Prompt"; font-weight: 600; font-display: block;
    src: url(assets/fonts/prompt-latin-600-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root { --page: #1b2333; --ui: #e8eef8; --ui-dim: #9fb0c8; --accent: #8B5CF6; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ui);
    font-family: "Prompt", system-ui, sans-serif; }
  .wrap { max-width: min(1280px, calc((100vh - 90px) * 16 / 9)); margin: 0 auto; padding: 16px; box-sizing: border-box; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); background: #FBF6EC; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .controls button, .controls label { background: #2a3550; color: var(--ui); border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-size: 15px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .controls input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .controls .time { font-variant-numeric: tabular-nums; color: var(--ui-dim); min-width: 92px; text-align: right; }
  body.render .wrap { max-width: none; padding: 0; }
  body.render .stage { border-radius: 0; box-shadow: none; width: 1920px; height: 1080px; }
  body.render .controls { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Prompt, sans-serif"></svg>
  </div>
  <div class="controls">
    <button id="play">⏸ หยุด</button>
    <input id="scrub" type="range" min="0" max="52" step="0.01" value="0">
    <span class="time" id="time">0.00 / 52.00</span>
    <label><input id="caps" type="checkbox" checked> คำบรรยาย/ข้อความ</label>
  </div>
</div>

<script>
/* =========================================================================
   "ร่องรอยลับในข้อความ AI" — 52 s explainer, 7 scenes (see STORYBOARD.md).
   Everything is a pure function of time t (seconds) → render(t), so the
   piece can be scrubbed in the browser and captured frame-by-frame.
   URL params:  ?render=1  (1920×1080, no UI, paused)   ?captions=0 (clean plate)
   ========================================================================= */
const DUR = 52;
const C = {
  cream: "#FBF6EC", navy: "#1E3A6E", blue: "#2F6FD6", sky: "#4AA3F0", pale: "#DDEBFA",
  paleLine: "#C6DAF2", white: "#FFFFFF", edge: "#CFDDEE", gray: "#B9C2CF", track: "#EEF0F5",
  purple: "#8B5CF6", yellow: "#F5C242", key: "#F2B833", skin: "#F3C7A1", hair: "#1F1F24", ink: "#2B2F3A",
};
const params = new URLSearchParams(location.search);
const RENDER = params.get("render") === "1";
let CAPTIONS = params.get("captions") !== "0";
if (RENDER) document.body.classList.add("render");

/* ---------- math helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const ein = p => p * p * p;
const lin = p => p;
const back = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const prog = (t, a, b, e = eio) => e(clamp((t - a) / (b - a)));
const bump = (t, a, b) => { const p = clamp((t - a) / (b - a)); return Math.sin(p * Math.PI); };
const mixHex = (h1, h2, p) => {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, clamp(p)));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};
function camKF(t, kfs) {   // [[time, cx, cy, scale], ...] — hold, then ease between keyframes
  if (t <= kfs[0][0]) return kfs[0].slice(1);
  for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i + 1];
    if (t <= b[0]) { const p = eio((t - a[0]) / (b[0] - a[0])); return [lerp(a[1], b[1], p), lerp(a[2], b[2], p), lerp(a[3], b[3], p)]; }
  }
  return kfs[kfs.length - 1].slice(1);
}

/* ---------- DOM helpers ---------- */
const svg = document.getElementById("svg");
const $ = id => document.getElementById(id);
const attr = (id, o) => { const el = typeof id === "string" ? $(id) : id; for (const k in o) el.setAttribute(k, o[k]); };
const op = (id, v) => $(id).setAttribute("opacity", clamp(v).toFixed(3));
const tf = (id, s) => $(id).setAttribute("transform", s);
const cam = (id, cx, cy, s) => tf(id, `translate(960 540) scale(${s}) translate(${-cx} ${-cy})`);
const lbl = (id, t, a, b) => op(id, CAPTIONS ? prog(t, a, a + 0.4) * (1 - prog(t, b - 0.3, b)) : 0);  // post-production labels
const label = (id, x, y, txt, o = {}) =>
  `<g id="${id}" opacity="0"><text x="${x}" y="${y}" text-anchor="${o.anchor || "middle"}" font-size="${o.size || 28}" font-weight="${o.weight || 500}" fill="${o.fill || C.navy}">${txt}</text></g>`;

/* ---------- reusable drawings ---------- */
function student(p) {
  return `
  <g id="${p}">
    <rect x="-16" y="-206" width="32" height="34" fill="${C.skin}"/>
    <path d="M-80 0 L-80 -118 Q-80 -176 -26 -180 L26 -180 Q80 -176 80 -118 L80 0 Z" fill="${C.yellow}"/>
    <path d="M-22 -180 L0 -158 L22 -180" fill="none" stroke="#E0A92E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="${p}-head">
      <circle cx="-58" cy="-258" r="12" fill="${C.skin}"/><circle cx="58" cy="-258" r="12" fill="${C.skin}"/>
      <circle cx="0" cy="-262" r="60" fill="${C.skin}"/>
      <path d="M-63 -258 Q-70 -334 0 -336 Q70 -334 63 -258 Q56 -296 22 -298 Q-4 -312 -36 -294 Q-56 -284 -63 -258 Z" fill="${C.hair}"/>
      <g id="${p}-eyes">
        <ellipse cx="-21" cy="-258" rx="6.5" ry="8.5" fill="${C.ink}"/>
        <ellipse cx="23" cy="-258" rx="6.5" ry="8.5" fill="${C.ink}"/>
      </g>
      <circle cx="-38" cy="-236" r="9" fill="#F49A9A" opacity=".45"/><circle cx="40" cy="-236" r="9" fill="#F49A9A" opacity=".45"/>
      <path d="M-11 -230 Q2 -219 15 -230" fill="none" stroke="${C.ink}" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>`;
}
function arm(id, color, hand, w = 30) {   // a sleeve line + hand circle, endpoints set per frame
  return `<g id="${id}"><line id="${id}-l" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>
          <circle id="${id}-h" r="${w * .55}" fill="${hand}"/></g>`;
}
function robotArm(id) {
  return `<g id="${id}"><line id="${id}-o" stroke="${C.edge}" stroke-width="30" stroke-linecap="round"/>
          <line id="${id}-l" stroke="${C.white}" stroke-width="22" stroke-linecap="round"/>
          <circle id="${id}-h" r="17" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/></g>`;
}
function setArm(id, x1, y1, x2, y2) {
  for (const s of ["-l", "-o"]) { const el = $(id + s); if (el) attr(el, { x1, y1, x2, y2 }); }
  attr(id + "-h", { cx: x2, cy: y2 });
}
function robot(p) {
  return `
  <g id="${p}">
    <ellipse cx="0" cy="6" rx="70" ry="10" fill="#000" opacity=".06"/>
    <rect x="-20" y="-166" width="40" height="22" rx="6" fill="#DCE6F2"/>
    <rect x="-72" y="-152" width="144" height="152" rx="42" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
    <circle cx="0" cy="-84" r="15" fill="#CFE6FF"/><circle cx="0" cy="-84" r="6" fill="${C.sky}"/>
    <g id="${p}-head">
      <line x1="0" y1="-292" x2="0" y2="-322" stroke="#9DB4CF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="-328" r="10" fill="${C.sky}"/>
      <rect x="-100" y="-246" width="16" height="40" rx="8" fill="#DCE6F2"/><rect x="84" y="-246" width="16" height="40" rx="8" fill="#DCE6F2"/>
      <rect x="-92" y="-292" width="184" height="132" rx="46" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
      <rect x="-72" y="-274" width="144" height="96" rx="32" fill="url(#screenGrad)"/>
      <g id="${p}-eyes">
        <circle cx="-30" cy="-226" r="14" fill="#EAF7FF"/><circle cx="30" cy="-226" r="14" fill="#EAF7FF"/>
      </g>
      <path d="M-14 -199 Q0 -191 14 -199" fill="none" stroke="#EAF7FF" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>`;
}
function pencil(id, s = 1) {   // tip at local (0, 22·s)
  return `<g id="${id}"><g transform="scale(${s}) translate(-8 -70)">
      <rect x="0" y="0" width="16" height="70" rx="3" fill="${C.blue}"/>
      <rect x="0" y="-12" width="16" height="14" rx="4" fill="#F4A6B4"/>
      <path d="M0 70 L8 92 L16 70 Z" fill="#F3D9B1"/><path d="M5 84 L8 92 L11 84 Z" fill="${C.ink}"/>
    </g></g>`;
}
function keyIcon(id) {
  return `<g id="${id}"><g filter="url(#shadowSm)">
      <circle cx="-36" cy="0" r="25" fill="none" stroke="${C.key}" stroke-width="14"/>
      <rect x="-14" y="-7" width="84" height="14" rx="7" fill="${C.key}"/>
      <rect x="44" y="2" width="12" height="24" rx="4" fill="${C.key}"/><rect x="60" y="2" width="10" height="17" rx="4" fill="${C.key}"/>
      <circle cx="-36" cy="0" r="7" fill="#FFF3CF"/></g></g>`;
}
function textLines(x, y, w, n, gap, h, widths, color = C.gray, idp = "") {
  let s = "";
  for (let i = 0; i < n; i++) {
    const lw = w * widths[i % widths.length];
    s += `<rect ${idp ? `id="${idp}${i}"` : ""} x="${x}" y="${y + i * gap}" width="${lw}" height="${h}" rx="${h / 2}" fill="${color}"/>`;
  }
  return s;
}
function dot(id, x = 0, y = 0) {
  return `<g id="${id}" transform="translate(${x} ${y})">
      <circle r="26" fill="${C.purple}" opacity=".18" filter="url(#glow)"/>
      <circle id="${id}-ring" r="14" fill="none" stroke="${C.purple}" stroke-width="3" opacity="0"/>
      <circle r="9" fill="${C.purple}" filter="url(#glowSoft)"/><circle r="4" fill="#E9DDFF"/></g>`;
}
function piecePath(w, h, left, right) {
  // left/right: 1 = tab out, -1 = hole, 0 = flat. Tabs are arcs (r 34) on a 44px neck.
  const m = h / 2, r = 34, n = 22;
  let d = `M0 0 L${w} 0 `;
  d += right ? `L${w} ${m - n} A${r} ${r} 0 1 ${right > 0 ? 1 : 0} ${w} ${m + n} L${w} ${h} ` : `L${w} ${h} `;
  d += `L0 ${h} `;
  d += left ? `L0 ${m + n} A${r} ${r} 0 1 ${left > 0 ? 1 : 0} 0 ${m - n} L0 0 Z` : `Z`;
  return d;
}
const PANEL_RECT = `<rect x="-210" y="-150" width="420" height="300" rx="28" fill="${C.white}" stroke="${C.purple}" stroke-width="5" filter="url(#shadow)"/>`;

/* ---------- scene data ---------- */
const DOT_PATTERN = [1, 0, 1, 1, 0, 1];               // which words carry the hidden signal
const DOT_FRAC = [0.22, 0, 0.66, 0.42, 0, 0.8];        // where along the line the dot sits
const LINE_W = [0.92, 0.86, 0.94, 0.8, 0.9, 0.56, 0.88, 0.7];

// Scene 2 — the word engine: one detailed cycle, then three fast ones.
// B = score bars, G = 1 if the word lands in the "special group", P = word that gets picked.
const ENG = {
  candX: 900, candY: [400, 480, 560, 640, 720], cw: 170, ch: 62, barX: 1020, boost: 60,
  mixX: 520, mixY: 560, keyDock: [372, 560], slotX: 1000, rowY: 210, step: 190,
  cycles: [
    { s: 4.0,   B: [330, 290, 200, 140, 90],  G: [0, 1, 0, 1, 1], P: 1 },   // boost lifts #2 past #1
    { s: 21.0,  B: [260, 240, 180, 150, 100], G: [1, 0, 0, 1, 0], P: 0 },
    { s: 22.55, B: [300, 200, 170, 120, 80],  G: [0, 1, 1, 0, 1], P: 0 },   // a normal word can still win
    { s: 24.1,  B: [220, 210, 190, 130, 90],  G: [0, 0, 1, 1, 0], P: 2 },
  ],
  inner: [[.7, .45], [.55, .62], [.66, .38], [.5, .3], [.72, .5], [.6, .4], [.45, .58]],
};
const WRITTEN_DOT = [1, 0, 1, 1, 0, 1];                  // = DOT_PATTERN: result of the cycles above
const ENG_KF = [[4, 980, 500, 1.2], [9.2, 980, 470, 1.14], [10.3, 790, 500, 1.14], [14.8, 800, 500, 1.14],
  [15.8, 980, 510, 1.12], [20.3, 980, 510, 1.12], [21.2, 960, 500, 1.08], [25.3, 960, 500, 1.08], [26, 960, 540, 1.0]];
function phase(ci) {
  const s = ENG.cycles[ci].s;
  if (ci === 0) return { bar: [6.0, 7.4], ghost: [10.0, 10.9], spin: [10.8, 12.0], beam: [11.9, 12.7], mark: [12.2, 13.2],
    boost: [15.4, 16.6], hi: [17.6, 18.4], pick: [18.4, 19.6], dot: [19.6, 20.0], shift: [20.1, 20.8] };
  return { inA: s, inB: s + 0.25, bar: [s + 0.15, s + 0.45], ghost: [s + 0.12, s + 0.45], spin: [s + 0.3, s + 0.6],
    beam: [s + 0.42, s + 0.7], mark: [s + 0.5, s + 0.7], boost: [s + 0.68, s + 0.88], hi: [s + 0.82, s + 0.92],
    pick: [s + 0.9, s + 1.3], dot: [s + 1.3, s + 1.45], shift: ci === 3 ? null : [s + 1.3, s + 1.55] };
}
// Scene 3 cards → lines
const S3 = { n: 6, cw: 170, ch: 62, gap: 195, rowY: 455,
  lx: 610, ly: 330, lgap: 64, lh: 16, lw: [700, 650, 690, 610, 680, 430] };
// Scene 5 copy-on-screen geometry
const S5 = { sx: 915, sy: 245, sw: 230, sh: 300 };
// Scene 6 paper
const S6 = { x: 610, y: 240, w: 380, lx: 660, ly: 300, lgap: 50, lw: 280, newW: [0.7, 0.95, 0.62] };

/* ---------- build the scene graph ---------- */
function build() {
  let s = `
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58B2F5"/><stop offset="1" stop-color="#2F86E0"/></linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky}" stop-opacity="0"/><stop offset="1" stop-color="${C.sky}" stop-opacity=".45"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E3A6E" flood-opacity=".14"/></filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A6E" flood-opacity=".18"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.4" fill="${C.paleLine}"/></pattern>
    <clipPath id="screenClip"><rect x="724" y="194" width="612" height="392" rx="16"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="${C.cream}"/>`;

  /* ===== Scene 1: asking AI to write ===== */
  s += `<g id="sc1"><g id="cam1">
    <circle cx="300" cy="260" r="220" fill="#EAF2FC"/><circle cx="1700" cy="200" r="160" fill="#EAF2FC"/>
    <rect x="-200" y="860" width="2320" height="400" fill="#F3EBDD"/>
    <g transform="translate(560 650)">${student("st1")}</g>
    <g transform="translate(1360 650) scale(.92)">${robot("rb1")}</g>
    <rect x="330" y="634" width="1260" height="36" rx="18" fill="#BFD6F2"/>
    <rect x="360" y="664" width="1200" height="20" rx="8" fill="#A9C6EC"/>
    <rect x="420" y="684" width="34" height="200" rx="10" fill="#A9C6EC"/><rect x="1466" y="684" width="34" height="200" rx="10" fill="#A9C6EC"/>
    <g id="s1-paper" filter="url(#shadow)"><rect x="-58" y="-74" width="116" height="148" rx="10" fill="${C.white}" stroke="${C.edge}" stroke-width="3"/></g>
    ${arm("st1-armL", C.yellow, C.skin)}${arm("st1-armR", C.yellow, C.skin)}
    ${robotArm("rb1-armL")}${robotArm("rb1-armR")}
    ${pencil("rb1-pencil")}
  </g></g>`;

  /* ===== Scene 2: inside the AI — how a word gets chosen and nudged ===== */
  const E = ENG;
  s += `<g id="sc2"><g id="cam2">
    <rect x="-300" y="-300" width="2520" height="1680" fill="${C.pale}"/>
    <rect x="-300" y="-300" width="2520" height="1680" fill="url(#grid)" opacity=".8"/>
    <circle cx="160" cy="900" r="260" fill="#E8F1FC"/><circle cx="1800" cy="120" r="220" fill="#E8F1FC"/>
    <rect id="e-slot" x="${E.slotX - E.cw / 2}" y="${E.rowY - E.ch / 2}" width="${E.cw}" height="${E.ch}" rx="18" fill="none" stroke="${C.blue}" stroke-width="4" stroke-dasharray="14 10"/>`;
  for (let i = 0; i < 5; i++) {
    const y = E.candY[i];
    s += `<line id="bm${i}" x1="${E.mixX + 82}" y1="${E.mixY}" x2="${E.candX - 150}" y2="${y}" stroke="${C.purple}" stroke-width="5" stroke-linecap="round" opacity="0"/>`;
  }
  for (let i = 0; i < 5; i++) {
    const y = E.candY[i];
    s += `<rect id="ct${i}" x="${E.barX}" y="${y - 14}" width="420" height="28" rx="14" fill="#E6EFFA"/>
      <rect id="cb${i}" x="${E.barX}" y="${y - 14}" width="1" height="28" rx="14" fill="${C.sky}"/>
      <rect id="cbb${i}" x="${E.barX}" y="${y - 14}" width="1" height="28" rx="14" fill="${C.purple}"/>
      <g id="cd${i}" filter="url(#shadow)">
        <rect id="cd${i}-r" x="${-E.cw / 2}" y="${-E.ch / 2}" width="${E.cw}" height="${E.ch}" rx="18" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
        <rect id="cd${i}-a" x="${-E.cw / 2 + 22}" y="-13" height="12" rx="6" fill="#9DB9DD"/>
        <rect id="cd${i}-b" x="${-E.cw / 2 + 22}" y="5" height="12" rx="6" fill="#C7D7EC"/>
      </g>
      ${dot(`cdm${i}`, E.candX - 120, y)}`;
  }
  // written words (top row): fixed inner geometry so they match scene 3 exactly
  for (let k = 0; k < 6; k++) {
    s += dot(`wd${k}`);
    s += `<g id="w${k}" filter="url(#shadow)">
      <rect x="${-E.cw / 2}" y="${-E.ch / 2}" width="${E.cw}" height="${E.ch}" rx="18" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
      <rect x="${-E.cw / 2 + 22}" y="${-E.ch / 2 + E.ch * 0.3}" width="${E.cw * 0.55}" height="12" rx="6" fill="#9DB9DD"/>
      <rect x="${-E.cw / 2 + 22}" y="${-E.ch / 2 + E.ch * 0.58}" width="${E.cw * 0.38}" height="12" rx="6" fill="#C7D7EC"/></g>`;
  }
  s += `<g id="ghost"><rect x="${-E.cw / 2}" y="${-E.ch / 2}" width="${E.cw}" height="${E.ch}" rx="18" fill="${C.white}" stroke="${C.blue}" stroke-width="4" stroke-dasharray="10 8"/>
      <rect x="${-E.cw / 2 + 22}" y="${-E.ch / 2 + E.ch * 0.3}" width="${E.cw * 0.55}" height="12" rx="6" fill="#9DB9DD"/></g>
    <g id="mixer" transform="translate(${E.mixX} ${E.mixY})">

function render1(t) {
  cam("cam1", lerp(960, 1150, prog(t, 0.2, 4)), lerp(540, 520, prog(t, 0.2, 4)), lerp(1, 1.22, prog(t, 0.2, 4)));
  const pp = prog(t, 0.35, 1.55), px = lerp(790, 1172, pp), py = lerp(568, 556, pp) - 18 * bump(t, 0.35, 1.55);
  tf("s1-paper", `translate(${px} ${py}) rotate(${lerp(-8, 5, pp)})`);
  const release = prog(t, 0.95, 1.6);
  let hx = Math.min(px - 54, 760), hy = py + 6;
  hx = lerp(hx, 690, release); hy = lerp(hy, 612, release);
  if (t < 0.35) { hx = 736; hy = 574; }
  setArm("st1-armR", 622, 490, hx, hy);
  setArm("st1-armL", 498, 490, 520, 610);
  tf("st1-eyes", `translate(6 0)`);
  tf("st1-head", `translate(0 ${-3 * bump(t, 1.4, 2.0)})`);
  const reach = prog(t, 0.9, 1.45);
  setArm("rb1-armL", 1294, 532, lerp(1278, px + 52, reach), lerp(624, py + 10, reach));
  const lift = prog(t, 2.15, 3.0, back);
  const rhx = lerp(1450, 1372, lift), rhy = lerp(616, 566, lift);
  setArm("rb1-armR", 1426, 532, rhx, rhy);
  tf("rb1-pencil", `translate(${rhx} ${rhy + 6}) rotate(${lerp(10, -40, lift)})`);
  tf("rb1-head", `translate(0 ${10 * bump(t, 1.55, 1.9) + 7 * bump(t, 1.9, 2.25)})`);
  const blink = 1 - 0.9 * bump(t, 3.2, 3.4);
  tf("rb1-eyes", `translate(-8 -226) scale(1 ${blink}) translate(0 226)`);
}

function render2(t) {
  const E = ENG;
  const [cx, cy, sc] = camKF(t, ENG_KF); cam("cam2", cx, cy, sc);
  let ci = 0; for (let i = 0; i < E.cycles.length; i++) if (t >= E.cycles[i].s) ci = i;
  const c = E.cycles[ci], ph = phase(ci), nextS = ci < E.cycles.length - 1 ? E.cycles[ci + 1].s : 1e9;
  const endF = 1 - prog(t, 25.3, 25.75);                  // engine parts leave before scene 3
  const outF = (1 - prog(t, nextS - 0.2, nextS)) * endF;

  /* candidates, score bars, special-group marks, beams */
  for (let i = 0; i < 5; i++) {
    const y = E.candY[i];
    const a = ci === 0 ? prog(t, 5.0 + i * 0.15, 5.5 + i * 0.15, back) : prog(t, ph.inA, ph.inB);
    const picked = i === c.P && t >= ph.pick[0];
    const hi = i === c.P ? prog(t, ph.hi[0], ph.hi[1]) : 0;
    const s0 = ci === 0 ? lerp(0.6, 1, a) : 1;
    tf(`cd${i}`, `translate(${E.candX} ${y}) scale(${s0 * (1 + 0.05 * hi)})`);
    op(`cd${i}`, clamp(a) * outF * (picked ? 0 : 1));
    const iw = E.inner[(i + ci * 2) % E.inner.length];
    attr(`cd${i}-a`, { width: (E.cw - 44) * iw[0] }); attr(`cd${i}-b`, { width: (E.cw - 44) * iw[1] });
    const m = c.G[i] * prog(t, ph.mark[0], ph.mark[1]);
    attr(`cd${i}-r`, { stroke: hi > 0.01 ? C.blue : mixHex(C.edge, C.purple, m), "stroke-width": 4 + 2 * hi });
    const markO = m * outF * (i === c.P ? 1 - prog(t, ph.pick[0], ph.pick[0] + 0.25) : 1);
    tf(`cdm${i}`, `translate(${E.candX - 120} ${y}) scale(${0.72 * Math.max(0.01, c.G[i] * prog(t, ph.mark[0], ph.mark[1], back))})`);
    op(`cdm${i}`, markO);
    // bars: base score, then a small purple boost for the special group
    const bp = ci === 0 ? prog(t, 6.0 + i * 0.1, 6.8 + i * 0.1) : prog(t, ph.bar[0], ph.bar[1]);
    const bw = c.B[i] * bp, boost = E.boost * c.G[i] * prog(t, ph.boost[0], ph.boost[1]);
    const barO = outF * (picked ? lerp(1, 0.35, prog(t, ph.pick[0], ph.pick[0] + 0.4)) : 1);
    attr(`cb${i}`, { width: Math.max(0.01, bw) }); op(`cb${i}`, barO * (bw > 1 ? 1 : 0));
    attr(`cbb${i}`, { x: E.barX + bw - 14, width: Math.max(0.01, boost + (boost > 0 ? 14 : 0)) }); op(`cbb${i}`, barO * (boost > 0.5 ? 1 : 0));
    op(`ct${i}`, prog(t, 5.6, 6.2) * endF);
    // beams from the mixer to the words that join the special group
    const L = Math.hypot(E.candX - 150 - (E.mixX + 82), y - E.mixY);
    const bmP = prog(t, ph.beam[0], ph.beam[1]);
    attr(`bm${i}`, { "stroke-dasharray": L, "stroke-dashoffset": L * (1 - bmP) });
    op(`bm${i}`, c.G[i] && bmP > 0 ? (1 - prog(t, ph.beam[1], ph.beam[1] + 0.5)) * 0.9 : 0);
  }

  /* secret key + mixer */
  const mxIn = prog(t, 9.3, 9.9, back);
  const spin = prog(t, ph.spin[0], ph.spin[1]);
  tf("mixer", `translate(${E.mixX} ${E.mixY}) scale(${Math.max(0.01, mxIn) * (1 + 0.06 * bump(t, ph.spin[0], ph.spin[1]))})`);
  op("mixer", prog(t, 9.3, 9.6) * endF);
  tf("mx-arrows", `rotate(${360 * (ci + spin)})`);
  op("mx-glow", 0.55 * bump(t, ph.spin[0], ph.spin[1] + 0.2));
  const kp = prog(t, 9.4, 10.4);
  const kx = lerp(-160, E.keyDock[0], kp), ky = lerp(250, E.keyDock[1], kp) - 60 * bump(t, 9.4, 10.4);
  tf("e-key", `translate(${kx} ${ky}) rotate(${lerp(-70, 0, kp)}) scale(${1 + 0.1 * bump(t, ph.spin[0], ph.spin[1])})`);
  op("e-key", prog(t, 9.4, 9.6) * endF);

  /* previous word copies down into the mixer */
  const gp = prog(t, ph.ghost[0], ph.ghost[1]);
  const gx = lerp(E.slotX - E.step, E.mixX, gp), gy = lerp(E.rowY, E.mixY - 70, gp) - 30 * bump(t, ph.ghost[0], ph.ghost[1]);
  tf("ghost", `translate(${gx} ${gy}) scale(${lerp(1, 0.4, gp)})`);
  op("ghost", t >= ph.ghost[0] && t <= ph.ghost[1] + 0.05 ? prog(t, ph.ghost[0], ph.ghost[0] + 0.1) * (1 - prog(t, ph.ghost[1] - 0.15, ph.ghost[1])) : 0);

  /* written row: shifts left after each pick, then regroups into scene 3's row */
  let shiftSum = 0;
  E.cycles.forEach((_, j) => { const pj = phase(j); if (pj.shift) shiftSum += prog(t, pj.shift[0], pj.shift[1]); });
  const fin = prog(t, 25.35, 26.0);
  for (let k = 0; k < 6; k++) {
    let x = E.slotX + (k - 2) * E.step - E.step * shiftSum, y = E.rowY, o = 1, s = 1, dotA = 0;
    if (k < 2) {
      const a = prog(t, 4.2 + k * 0.1, 4.6 + k * 0.1, back); s = lerp(0.6, 1, a); o = clamp(a);
      dotA = WRITTEN_DOT[k] ? prog(t, 4.5, 4.9, back) : 0;
    } else {
      const j = k - 2, cj = E.cycles[j], pj = phase(j);
      if (t < pj.pick[0]) o = 0;
      const p = prog(t, pj.pick[0], pj.pick[1]);
      x = lerp(E.candX, x, p); y = lerp(E.candY[cj.P], E.rowY, p) - 50 * bump(t, pj.pick[0], pj.pick[1]);
      s = 1 + 0.08 * bump(t, pj.pick[0], pj.pick[1]);
      dotA = cj.G[cj.P] ? prog(t, pj.dot[0], pj.dot[1], back) : 0;
    }
    x = lerp(x, 960 + (k - 2.5) * S3.gap, fin); y = lerp(y, S3.rowY, fin);
    tf(`w${k}`, `translate(${x} ${y}) scale(${s})`); op(`w${k}`, o);
    tf(`wd${k}`, `translate(${x} ${y + 60}) scale(${Math.max(0.01, dotA)})`); op(`wd${k}`, o * (dotA > 0.01 ? 1 : 0));
  }
  // dashed slot for the next word
  let occ = 0;
  E.cycles.forEach((_, j) => { const pj = phase(j);
    occ = Math.max(occ, prog(t, pj.pick[1] - 0.3, pj.pick[1]) * (pj.shift ? 1 - prog(t, pj.shift[1] - 0.1, pj.shift[1] + 0.15) : 1)); });
  op("e-slot", prog(t, 4.4, 4.8) * (1 - occ) * (1 - prog(t, 25.2, 25.5)) * (0.65 + 0.35 * Math.sin(t * 5)));

  /* post-production labels */
  lbl("l-written", t, 4.5, 9.0); lbl("l-next", t, 5.2, 9.2); lbl("l-score", t, 6.3, 9.2);
  lbl("l-key", t, 9.9, 14.9); lbl("l-prev", t, 9.95, 11.3);
  lbl("l-group", t, 12.8, 25.3); lbl("l-boost", t, 15.6, 18.6);
}

function render3(t) {
  const l = t - 26;
  cam("cam3", 960, lerp(540, 545, prog(l, 0, 4)), lerp(1.0, 0.97, prog(l, 0, 4)));
  const bgP = prog(l, 1.0, 3.0);
  attr("s3-bg", { fill: mixHex(C.pale, C.cream, bgP) }); op("s3-grid", 0.8 * (1 - bgP));
  const pp = prog(l, 0.0, 0.6);
  tf("s3-paper", `translate(0 ${lerp(70, 0, pp)})`); op("s3-paper", pp);
  op("s3-extra", prog(l, 1.7, 2.1));
  for (let i = 0; i < S3.n; i++) {
    const cx = 960 + (i - 2.5) * S3.gap, cy = S3.rowY;
    const a0 = 0.5 + i * 0.14, m = prog(l, a0, a0 + 0.8);
    const x = lerp(cx - S3.cw / 2, S3.lx, m), y = lerp(cy - S3.ch / 2, S3.ly + i * S3.lgap, m) - 26 * bump(l, a0, a0 + 0.8);
    const w = lerp(S3.cw, S3.lw[i], m), h = lerp(S3.ch, S3.lh, m);
    attr(`s3c${i}-r`, { x, y, width: w, height: h, rx: lerp(18, S3.lh / 2, m), fill: mixHex(C.white, C.gray, m), "stroke-opacity": 1 - m });
    op(`s3c${i}-in`, 1 - clamp(m * 2.5));
    attr(`s3c${i}-a`, { x: x + 22, y: y + h * 0.3, width: w * 0.55 * (1 - m) + 1 });
    attr(`s3c${i}-b`, { x: x + 22, y: y + h * 0.58, width: w * 0.38 * (1 - m) + 1 });
    if (DOT_PATTERN[i]) {
      const dx = lerp(cx, S3.lx + S3.lw[i] * DOT_FRAC[i], m), dy = lerp(cy + 60, S3.ly + i * S3.lgap + S3.lh / 2, m);
      const blinkP = bump(l, 2.15, 2.6);
      tf(`s3d${i}`, `translate(${dx} ${dy}) scale(${lerp(1, 0.8, m) * (1 + 0.7 * blinkP)})`);
      op(`s3d${i}`, 1 - prog(l, 2.8, 3.6));
      const ring = prog(l, 2.15, 2.8, eout);
      attr(`s3d${i}-ring`, { r: 14 + 30 * ring, opacity: (l > 2.15 ? 1 - ring : 0).toFixed(3) });
    }
  }
}

function render4(t) {
  const l = t - 30;
  const z = prog(l, 2.05, 3.95);
  cam("cam4", lerp(960, 930, z), lerp(540, 640, z), lerp(1, 1.75, z));
  const read = clamp((l - 0.3) / 1.7);
  tf("st4-eyes", `translate(${9 + 4 * Math.sin(read * Math.PI * 6)} ${lerp(-4, 9, read)})`);
  tf("st4-head", `translate(0 ${9 * bump(l, 1.95, 2.3) + 6 * bump(l, 2.3, 2.6)})`);
  const breathe = 2 * Math.sin(t * 3);
  tf("s4-paper", `translate(930 ${655 + breathe}) rotate(-4)`);
  setArm("st4-armL", 619, 692, 806, 800 + breathe);
  setArm("st4-armR", 781, 692, 1066, 752 + breathe);
  const bob = 5 * Math.sin(l * 2.4);
  tf("rb4w", `translate(1480 ${860 + bob})`);
  setArm("rb4-armL", 1410, 740 + bob, 1392, 836 + bob);
  setArm("rb4-armR", 1550, 740 + bob, 1568, 836 + bob);
  const blink = 1 - 0.9 * (bump(l, 1.1, 1.3) + bump(l, 3.2, 3.4));
  tf("rb4-eyes", `translate(-6 -226) scale(1 ${blink}) translate(0 226)`);
}

function render5(t) {
  const l = t - 34;
  cam("cam5", lerp(990, 1010, prog(l, 0, 7, lin)), 470, lerp(1.0, 1.04, prog(l, 0, 7, lin)));
  // the same secret key plugs into the detector
  const kp = prog(l, 0.2, 1.1);
  tf("s5-key", `translate(${lerp(-150, 676, kp)} ${lerp(120, 230, kp) - 50 * bump(l, 0.2, 1.1)}) rotate(${lerp(-60, 0, kp)}) scale(.62)`);
  op("s5-key", prog(l, 0.2, 0.4));
  op("s5-keyglow", 0.6 * bump(l, 1.0, 1.7));
  const sy = lerp(194, 600, prog(l, 1.2, 3.6, lin));
  tf("s5-scan", `translate(0 ${sy})`); op("s5-scan", prog(l, 1.0, 1.25) * (1 - prog(l, 3.5, 3.9)));
  for (let i = 0; i < S3.n; i++) if (DOT_PATTERN[i]) {
    const g = $("s5d" + i), y = +g.dataset.y, a = clamp((sy - y) / 40);
    g.setAttribute("opacity", a.toFixed(3));
    g.setAttribute("transform", `translate(${g.dataset.x} ${y}) scale(${0.62 * (0.6 + 0.4 * back(a))})`);
  }
  const r = prog(l, 3.8, 4.4, back);
  tf("s5-result", `translate(1640 400) scale(${Math.max(0.01, r)})`); op("s5-result", prog(l, 3.8, 4.05));
  attr("s5-b1", { width: Math.max(0.01, 155 * prog(l, 4.5, 5.3)) });
  attr("s5-b2", { width: Math.max(0.01, 300 * prog(l, 4.8, 5.9)) });
  op("s5-lbls", CAPTIONS ? prog(l, 4.6, 5.0) : 0);
  op("s5-title", CAPTIONS ? prog(l, 5.9, 6.3) : 0);
}

function render6(t) {
  const l = t - 41;
  cam("cam6", 960, 520, lerp(1.03, 1.0, prog(l, 0, 5)));
  // 1) short text: lower lines disappear
  for (let i = 3; i < 8; i++) {
    const a = 0.4 + (7 - i) * 0.18;
    op(`s6l${i}`, 1 - prog(l, a, a + 0.35));
    if (DOT_PATTERN[i]) op(`s6d${i}`, 1 - prog(l, a, a + 0.35));
  }
  const shortP = prog(l, 0.6, 1.7);
  attr("s6p", { height: lerp(480, 210, shortP) });
  // 2) edited text: a pencil rewrites the remaining lines, the hidden dots pop away
  let popped = 0, px = 1180, py = 330, rot = 30;
  for (let i = 0; i < 3; i++) {
    const a = 2.0 + i * 0.7, p = prog(l, a, a + 0.7, lin);
    const w0 = S6.lw * LINE_W[i], w1 = S6.lw * S6.newW[i];
    attr(`s6l${i}`, { width: lerp(w0, w1, p), fill: mixHex(C.gray, "#8FBBEF", bump(l, a, a + 0.9)) });
    if (l >= a && l < a + 0.7) { px = S6.lx + lerp(0, Math.max(w0, w1), p); py = S6.ly + i * S6.lgap + 7; rot = 25; }
    if (DOT_PATTERN[i]) {
      const tp = a + 0.7 * DOT_FRAC[i], q = prog(l, tp, tp + 0.25);
      popped += q;
      tf(`s6d${i}`, `translate(${S6.lx + S6.lw * LINE_W[i] * DOT_FRAC[i]} ${S6.ly + i * S6.lgap + 7}) scale(${Math.max(0.01, 1 + 0.6 * bump(l, tp, tp + 0.12) - q)})`);
      op(`s6d${i}`, 1 - q);
    }
  }
  if (l < 2.0) { const p = prog(l, 1.6, 2.0); px = lerp(1180, S6.lx, p); py = lerp(330, S6.ly + 7, p); }
  if (l >= 4.1) { const p = prog(l, 4.1, 4.6); px = lerp(S6.lx + S6.lw * S6.newW[2], 1180, p); py = lerp(S6.ly + 2 * S6.lgap + 7, 330, p); }
  const th = rot * Math.PI / 180;
  tf("s6-pencil", `translate(${px + 33 * Math.sin(th)} ${py - 33 * Math.cos(th)}) rotate(${rot})`);
  op("s6-pencil", prog(l, 1.6, 1.8) * (1 - prog(l, 4.3, 4.6)));
  attr("s6-fill", { width: Math.max(40, 300 - 85 * shortP - 62 * popped) });
  op("s6-title", CAPTIONS ? prog(l, 0.2, 0.6) : 0);
  op("s6-lbls", CAPTIONS ? prog(l, 0.4, 0.8) : 0);
  lbl("s6-lab1", t, 41.3, 42.9); lbl("s6-lab2", t, 42.9, 45.8);
}

function render7(t) {
  const l = t - 46;
  cam("cam7", 960, lerp(500, 530, prog(l, 0, 6)), lerp(1.1, 1.0, prog(l, 0, 6)));
  const P = 240, fin = { A: [600 + P / 2, 560], B: [840 + P / 2, 560], C: [1080 + P / 2, 560] };
  const pre = { A: [fin.A[0] - 70, 560], B: [fin.B[0], 600], C: [fin.C[0] + 70, 560] };
  // signal meter → purple puzzle piece
  const f = prog(l, 0.0, 0.9);
  const fx = lerp(1420, pre.A[0], f), fy = lerp(480, pre.A[1], f);
  tf("s7-frame", `translate(${fx} ${fy}) scale(${lerp(1, 0.6, f)})`);
  op("s7-frame", 1 - prog(l, 0.55, 1.0));
  op("s7-frameIn", 1 - prog(l, 0.1, 0.45));
  const asm = prog(l, 2.45, 3.6, back);
  const A = { x: lerp(pre.A[0], fin.A[0], asm), y: lerp(pre.A[1], fin.A[1], asm), r: lerp(-6, 0, asm) };
  const aIn = prog(l, 0.5, 1.1, back);
  tf("pzA", `translate(${f < 1 ? fx : A.x} ${f < 1 ? fy : A.y}) rotate(${A.r}) scale(${Math.max(0.01, aIn)})`); op("pzA", prog(l, 0.5, 0.8));
  const bIn = prog(l, 1.0, 2.0, eout), cIn = prog(l, 1.3, 2.3, eout);
  tf("pzB", `translate(${lerp(pre.B[0], fin.B[0], asm)} ${lerp(pre.B[1] + 520 * (1 - bIn), fin.B[1], asm)}) rotate(${lerp(5, 0, asm)})`); op("pzB", prog(l, 1.0, 1.3));
  tf("pzC", `translate(${lerp(pre.C[0] + 760 * (1 - cIn), fin.C[0], asm)} ${lerp(pre.C[1], fin.C[1], asm)}) rotate(${lerp(7, 0, asm)})`); op("pzC", prog(l, 1.3, 1.6));
}

/* ---------- master render ---------- */
const sceneFns = [render1, render2, render3, render4, render5, render6, render7];
function render(t) {
  t = clamp(t, 0, DUR);
  SCENES.forEach(([a, b], i) => {
    const fadeIn = i === 0 ? 1 : prog(t, a - 0.18, a + 0.18, lin);
    const fadeOut = i === SCENES.length - 1 ? 1 : 1 - prog(t, b - 0.18, b + 0.18, lin);
    const v = fadeIn * fadeOut;
    const g = $("sc" + (i + 1));
    g.setAttribute("opacity", v.toFixed(3));
    g.style.display = v <= 0.001 ? "none" : "";
    if (v > 0.001) sceneFns[i](t);
  });
  // overlays
  op("title", CAPTIONS ? prog(t, 0.1, 0.6) * (1 - prog(t, 3.3, 3.8)) : 0);
  tf("title", `translate(0 ${lerp(-20, 0, prog(t, 0.1, 0.7, eout))})`);
  op("tag", CAPTIONS ? prog(t, 4.4, 4.8) * (1 - prog(t, 29.4, 29.8)) : 0);
  op("closing", CAPTIONS ? prog(t, 49.4, 50.0) : 0);
  tf("closing", `translate(0 ${lerp(16, 0, prog(t, 49.4, 50.0, eout))})`);
  const cap = CAPTIONS ? CAPS.find(([a, b]) => t >= a && t < b) : null;
  if (cap) {
    const tx = $("cap-t");
    if (tx.textContent !== cap[2]) {
      tx.textContent = cap[2];
      attr("cap-bg", { x: 960 - (tx.getComputedTextLength() + 96) / 2, width: tx.getComputedTextLength() + 96 });
    }
    op("cap", prog(t, cap[0], cap[0] + 0.25) * (1 - prog(t, cap[1] - 0.2, cap[1])));
  } else op("cap", 0);
}

/* ---------- playback UI ---------- */
build();
let t0 = performance.now(), cur = 0, playing = !RENDER;
const scrub = $("scrub"), timeEl = $("time"), playBtn = $("play");
function setT(t) { cur = t; render(t); scrub.value = t; timeEl.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)}`; }
function loop(now) {
  if (playing) setT(((now - t0) / 1000) % DUR);
  requestAnimationFrame(loop);
}
playBtn.onclick = () => {
  playing = !playing; playBtn.textContent = playing ? "⏸ หยุด" : "▶ เล่น";
  if (playing) t0 = performance.now() - cur * 1000;
};
scrub.oninput = () => { playing = false; playBtn.textContent = "▶ เล่น"; setT(+scrub.value); };
$("caps").checked = CAPTIONS;
$("caps").onchange = e => { CAPTIONS = e.target.checked; $("cap-t").textContent = ""; render(cur); };
window.__DUR = DUR;
window.__setTime = t => { render(t); };
Promise.all(["500 40px Prompt", "600 40px Prompt"].map(f => document.fonts.load(f, "กขAI")))
  .then(() => document.fonts.ready)
  .then(() => { fitTag(); window.__ready = true; setT(0); t0 = performance.now(); requestAnimationFrame(loop); });
</script>
</body>
</html>
