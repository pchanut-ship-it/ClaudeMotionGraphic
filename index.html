<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร่องรอยลับในข้อความ AI</title>
<style>
  @font-face { font-family: "Prompt"; font-weight: 500; font-display: block;
    src: url(assets/fonts/prompt-thai-500-normal.woff2) format("woff2");
    unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "Prompt"; font-weight: 500; font-display: block;
    src: url(assets/fonts/prompt-latin-500-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Prompt"; font-weight: 600; font-display: block;
    src: url(assets/fonts/prompt-thai-600-normal.woff2) format("woff2");
    unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "Prompt"; font-weight: 600; font-display: block;
    src: url(assets/fonts/prompt-latin-600-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root { --page: #1b2333; --ui: #e8eef8; --ui-dim: #9fb0c8; --accent: #8B5CF6; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ui);
    font-family: "Prompt", system-ui, sans-serif; }
  .wrap { max-width: min(1280px, calc((100vh - 90px) * 16 / 9)); margin: 0 auto; padding: 16px; box-sizing: border-box; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); background: #FBF6EC; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .controls button, .controls label { background: #2a3550; color: var(--ui); border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-size: 15px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .controls input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .controls .time { font-variant-numeric: tabular-nums; color: var(--ui-dim); min-width: 92px; text-align: right; }
  body.render .wrap { max-width: none; padding: 0; }
  body.render .stage { border-radius: 0; box-shadow: none; width: 1920px; height: 1080px; }
  body.render .controls { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Prompt, sans-serif"></svg>
  </div>
  <div class="controls">
    <button id="play">⏸ หยุด</button>
    <input id="scrub" type="range" min="0" max="30" step="0.01" value="0">
    <span class="time" id="time">0.00 / 30.00</span>
    <label><input id="caps" type="checkbox" checked> คำบรรยาย/ข้อความ</label>
  </div>
</div>

<script>
/* =========================================================================
   "ร่องรอยลับในข้อความ AI" — 30 s explainer, 6 scenes.
   Everything is a pure function of time t (seconds) → render(t), so the
   piece can be scrubbed in the browser and captured frame-by-frame.
   URL params:  ?render=1  (1920×1080, no UI, paused)   ?captions=0 (clean plate)
   ========================================================================= */
const DUR = 30;
const C = {
  cream: "#FBF6EC", navy: "#1E3A6E", blue: "#2F6FD6", sky: "#4AA3F0", pale: "#DDEBFA",
  paleLine: "#C6DAF2", white: "#FFFFFF", edge: "#CFDDEE", gray: "#B9C2CF",
  purple: "#8B5CF6", yellow: "#F5C242", skin: "#F3C7A1", hair: "#1F1F24", ink: "#2B2F3A",
};
const params = new URLSearchParams(location.search);
const RENDER = params.get("render") === "1";
let CAPTIONS = params.get("captions") !== "0";
if (RENDER) document.body.classList.add("render");

/* ---------- math helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const ein = p => p * p * p;
const lin = p => p;
const back = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const prog = (t, a, b, e = eio) => e(clamp((t - a) / (b - a)));
const bump = (t, a, b) => { const p = clamp((t - a) / (b - a)); return Math.sin(p * Math.PI); };
const mixHex = (h1, h2, p) => {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, p));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};

/* ---------- DOM helpers ---------- */
const svg = document.getElementById("svg");
const $ = id => document.getElementById(id);
const attr = (id, o) => { const el = typeof id === "string" ? $(id) : id; for (const k in o) el.setAttribute(k, o[k]); };
const op = (id, v) => $(id).setAttribute("opacity", clamp(v).toFixed(3));
const tf = (id, s) => $(id).setAttribute("transform", s);
const cam = (id, cx, cy, s) => tf(id, `translate(960 540) scale(${s}) translate(${-cx} ${-cy})`);

/* ---------- reusable drawings ---------- */
function student(p) {
  return `
  <g id="${p}">
    <rect x="-16" y="-206" width="32" height="34" fill="${C.skin}"/>
    <path d="M-80 0 L-80 -118 Q-80 -176 -26 -180 L26 -180 Q80 -176 80 -118 L80 0 Z" fill="${C.yellow}"/>
    <path d="M-22 -180 L0 -158 L22 -180" fill="none" stroke="#E0A92E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="${p}-head">
      <circle cx="-58" cy="-258" r="12" fill="${C.skin}"/><circle cx="58" cy="-258" r="12" fill="${C.skin}"/>
      <circle cx="0" cy="-262" r="60" fill="${C.skin}"/>
      <path d="M-63 -258 Q-70 -334 0 -336 Q70 -334 63 -258 Q56 -296 22 -298 Q-4 -312 -36 -294 Q-56 -284 -63 -258 Z" fill="${C.hair}"/>
      <g id="${p}-eyes">
        <ellipse cx="-21" cy="-258" rx="6.5" ry="8.5" fill="${C.ink}"/>
        <ellipse cx="23" cy="-258" rx="6.5" ry="8.5" fill="${C.ink}"/>
      </g>
      <circle cx="-38" cy="-236" r="9" fill="#F49A9A" opacity=".45"/><circle cx="40" cy="-236" r="9" fill="#F49A9A" opacity=".45"/>
      <path d="M-11 -230 Q2 -219 15 -230" fill="none" stroke="${C.ink}" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>`;
}
function arm(id, color, hand, w = 30) {   // a sleeve line + hand circle, endpoints set per frame
  return `<g id="${id}"><line id="${id}-l" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>
          <circle id="${id}-h" r="${w * .55}" fill="${hand}"/></g>`;
}
function robotArm(id) {
  return `<g id="${id}"><line id="${id}-o" stroke="${C.edge}" stroke-width="30" stroke-linecap="round"/>
          <line id="${id}-l" stroke="${C.white}" stroke-width="22" stroke-linecap="round"/>
          <circle id="${id}-h" r="17" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/></g>`;
}
function setArm(id, x1, y1, x2, y2) {
  for (const s of ["-l", "-o"]) { const el = $(id + s); if (el) attr(el, { x1, y1, x2, y2 }); }
  attr(id + "-h", { cx: x2, cy: y2 });
}
function robot(p) {
  return `
  <g id="${p}">
    <ellipse cx="0" cy="6" rx="70" ry="10" fill="#000" opacity=".06"/>
    <rect x="-20" y="-166" width="40" height="22" rx="6" fill="#DCE6F2"/>
    <rect x="-72" y="-152" width="144" height="152" rx="42" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
    <circle cx="0" cy="-84" r="15" fill="#CFE6FF"/><circle cx="0" cy="-84" r="6" fill="${C.sky}"/>
    <g id="${p}-head">
      <line x1="0" y1="-292" x2="0" y2="-322" stroke="#9DB4CF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="-328" r="10" fill="${C.sky}"/>
      <rect x="-100" y="-246" width="16" height="40" rx="8" fill="#DCE6F2"/><rect x="84" y="-246" width="16" height="40" rx="8" fill="#DCE6F2"/>
      <rect x="-92" y="-292" width="184" height="132" rx="46" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
      <rect x="-72" y="-274" width="144" height="96" rx="32" fill="url(#screenGrad)"/>
      <g id="${p}-eyes">
        <circle cx="-30" cy="-226" r="14" fill="#EAF7FF"/><circle cx="30" cy="-226" r="14" fill="#EAF7FF"/>
      </g>
      <path id="${p}-mouth" d="M-14 -199 Q0 -191 14 -199" fill="none" stroke="#EAF7FF" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>`;
}
function pencil(id) {
  return `<g id="${id}"><g transform="translate(-8 -70)">
      <rect x="0" y="0" width="16" height="70" rx="3" fill="${C.blue}"/>
      <rect x="0" y="-12" width="16" height="14" rx="4" fill="#F4A6B4"/>
      <path d="M0 70 L8 92 L16 70 Z" fill="#F3D9B1"/><path d="M5 84 L8 92 L11 84 Z" fill="${C.ink}"/>
    </g></g>`;
}
function textLines(x, y, w, n, gap, h, widths, color = C.gray, idp = "") {
  let s = "";
  for (let i = 0; i < n; i++) {
    const lw = w * widths[i % widths.length];
    s += `<rect ${idp ? `id="${idp}${i}"` : ""} x="${x}" y="${y + i * gap}" width="${lw}" height="${h}" rx="${h / 2}" fill="${color}"/>`;
  }
  return s;
}
function dot(id, x = 0, y = 0) {
  return `<g id="${id}" transform="translate(${x} ${y})">
      <circle r="26" fill="${C.purple}" opacity=".18" filter="url(#glow)"/>
      <circle id="${id}-ring" r="14" fill="none" stroke="${C.purple}" stroke-width="3" opacity="0"/>
      <circle r="9" fill="${C.purple}" filter="url(#glowSoft)"/><circle r="4" fill="#E9DDFF"/></g>`;
}
function piecePath(w, h, left, right) {
  // left/right: 1 = tab out, -1 = hole, 0 = flat. Tabs are arcs (r 34) on a 44px neck.
  const m = h / 2, r = 34, n = 22;
  let d = `M0 0 L${w} 0 `;
  d += right ? `L${w} ${m - n} A${r} ${r} 0 1 ${right > 0 ? 1 : 0} ${w} ${m + n} L${w} ${h} ` : `L${w} ${h} `;
  d += `L0 ${h} `;
  d += left ? `L0 ${m + n} A${r} ${r} 0 1 ${left > 0 ? 1 : 0} 0 ${m - n} L0 0 Z` : `Z`;
  return d;
}

/* ---------- scene data ---------- */
const DOT_PATTERN = [1, 0, 1, 1, 0, 1];               // which words carry the hidden signal
const DOT_FRAC = [0.22, 0, 0.66, 0.42, 0, 0.8];        // where along the line the dot sits
const LINE_W = [0.92, 0.86, 0.94, 0.8, 0.9, 0.56, 0.88, 0.7];

// Scene 2 cards
const S2 = { gx: [520, 960, 1400], gy: [290, 420, 550], cw: 230, ch: 100,
  sel: [1, 0, 2], slotX: [700, 960, 1220], slotY: 770, T: [5.0, 6.6, 8.2], dotted: [1, 0, 1] };
// Scene 3 cards → lines
const S3 = { n: 6, cw: 170, ch: 80, gap: 195, rowY: 455,
  lx: 610, ly: 330, lgap: 64, lh: 16, lw: [700, 650, 690, 610, 680, 430] };
// Scene 5 copy-on-screen geometry
const S5 = { sx: 915, sy: 245, sw: 230, sh: 300 };

/* ---------- build the scene graph ---------- */
function build() {
  let s = `
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58B2F5"/><stop offset="1" stop-color="#2F86E0"/></linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky}" stop-opacity="0"/><stop offset="1" stop-color="${C.sky}" stop-opacity=".45"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E3A6E" flood-opacity=".14"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.4" fill="${C.paleLine}"/></pattern>
    <clipPath id="screenClip"><rect x="724" y="194" width="612" height="392" rx="16"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="${C.cream}"/>`;

  /* ===== Scene 1: asking AI to write ===== */
  s += `<g id="sc1"><g id="cam1">
    <circle cx="300" cy="260" r="220" fill="#EAF2FC"/><circle cx="1700" cy="200" r="160" fill="#EAF2FC"/>
    <rect x="-200" y="860" width="2320" height="400" fill="#F3EBDD"/>
    <g transform="translate(560 650)">${student("st1")}</g>
    <g transform="translate(1360 650) scale(.92)">${robot("rb1")}</g>
    <rect x="330" y="634" width="1260" height="36" rx="18" fill="#BFD6F2"/>
    <rect x="360" y="664" width="1200" height="20" rx="8" fill="#A9C6EC"/>
    <rect x="420" y="684" width="34" height="200" rx="10" fill="#A9C6EC"/><rect x="1466" y="684" width="34" height="200" rx="10" fill="#A9C6EC"/>
    <g id="s1-paper" filter="url(#shadow)"><rect x="-58" y="-74" width="116" height="148" rx="10" fill="${C.white}" stroke="${C.edge}" stroke-width="3"/></g>
    ${arm("st1-armL", C.yellow, C.skin)}${arm("st1-armR", C.yellow, C.skin)}
    ${robotArm("rb1-armL")}${robotArm("rb1-armR")}
    ${pencil("rb1-pencil")}
  </g></g>`;

  /* ===== Scene 2: picking words, leaving a trace ===== */
  s += `<g id="sc2"><g id="cam2">
    <rect x="-300" y="-300" width="2520" height="1680" fill="${C.pale}"/>
    <rect x="-300" y="-300" width="2520" height="1680" fill="url(#grid)" opacity=".8"/>
    <circle cx="160" cy="900" r="260" fill="#E8F1FC"/><circle cx="1800" cy="120" r="220" fill="#E8F1FC"/>`;
  for (let g = 0; g < 3; g++) {
    s += `<rect x="${S2.gx[g] - 150}" y="${S2.gy[0] - 80}" width="300" height="420" rx="36" fill="#EEF5FD" opacity=".9"/>`;
  }
  for (let g = 0; g < 3; g++) if (S2.dotted[g]) s += dot(`s2-dot${g}`, S2.slotX[g], S2.slotY + 80);
  for (let g = 0; g < 3; g++) for (let k = 0; k < 3; k++) {
    const w = S2.cw, h = S2.ch, wv = [[.7, .45], [.55, .62], [.66, .38]][(g + k) % 3];
    s += `<g id="c${g}${k}" filter="url(#shadow)"><g id="c${g}${k}-in">
      <rect id="c${g}${k}-r" x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="20" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
      <rect x="${-w / 2 + 26}" y="-20" width="${(w - 52) * wv[0]}" height="14" rx="7" fill="#9DB9DD"/>
      <rect x="${-w / 2 + 26}" y="8" width="${(w - 52) * wv[1]}" height="14" rx="7" fill="#C7D7EC"/>
    </g></g>`;
  }
  s += `<g id="s2-hand">
      <line id="s2-arm-o" stroke="${C.edge}" stroke-width="58" stroke-linecap="round"/>
      <line id="s2-arm" stroke="${C.white}" stroke-width="46" stroke-linecap="round"/>
      <g id="s2-mitt"><rect x="-44" y="-40" width="88" height="62" rx="28" fill="${C.white}" stroke="${C.edge}" stroke-width="5"/>
        <rect x="-36" y="10" width="20" height="34" rx="10" fill="${C.white}" stroke="${C.edge}" stroke-width="5"/>
        <rect x="16" y="10" width="20" height="34" rx="10" fill="${C.white}" stroke="${C.edge}" stroke-width="5"/>
        <circle cx="0" cy="-10" r="9" fill="${C.sky}" opacity=".7"/></g>
    </g>
  </g></g>`;

  /* ===== Scene 3: the pattern hides in the text ===== */
  s += `<g id="sc3"><rect id="s3-bg" x="0" y="0" width="1920" height="1080" fill="${C.pale}"/><g id="cam3">
    <rect id="s3-grid" x="-300" y="-300" width="2520" height="1680" fill="url(#grid)" opacity=".8"/>
    <g id="s3-paper" filter="url(#shadow)"><rect x="540" y="260" width="840" height="580" rx="22" fill="${C.white}" stroke="${C.edge}" stroke-width="3"/></g>
    <g id="s3-extra">${textLines(S3.lx, S3.ly + 6 * S3.lgap, 700, 2, S3.lgap, S3.lh, [0.95, 0.6])}</g>`;
  for (let i = 0; i < S3.n; i++) {
    s += `<g id="s3c${i}"><rect id="s3c${i}-r" fill="${C.white}" stroke="${C.edge}" stroke-width="4"/>
      <g id="s3c${i}-in"><rect id="s3c${i}-a" height="12" rx="6" fill="#9DB9DD"/><rect id="s3c${i}-b" height="12" rx="6" fill="#C7D7EC"/></g></g>`;
  }
  for (let i = 0; i < S3.n; i++) if (DOT_PATTERN[i]) s += dot(`s3d${i}`);
  s += `</g></g>`;

  /* ===== Scene 4: the reader sees ordinary text ===== */
  s += `<g id="sc4"><g id="cam4">
    <circle cx="1500" cy="260" r="260" fill="#EAF2FC"/><circle cx="240" cy="180" r="150" fill="#EAF2FC"/>
    <g transform="translate(700 900) scale(1.3)">${student("st4")}</g>
    <g id="rb4w" transform="translate(1480 860)">${robot("rb4")}</g>
    ${robotArm("rb4-armL")}${robotArm("rb4-armR")}
    <line id="st4-armL-l" stroke="${C.yellow}" stroke-width="38" stroke-linecap="round"/>
    <line id="st4-armR-l" stroke="${C.yellow}" stroke-width="38" stroke-linecap="round"/>
    <g id="s4-paper" filter="url(#shadow)" transform="translate(930 655) rotate(-4)">
      <rect x="-140" y="-180" width="280" height="360" rx="14" fill="${C.white}" stroke="${C.edge}" stroke-width="3"/>
      ${textLines(-104, -136, 208, 9, 30, 11, LINE_W)}
    </g>
    <circle id="st4-armL-h" r="21" fill="${C.skin}"/><circle id="st4-armR-h" r="21" fill="${C.skin}"/>
  </g></g>`;

  /* ===== Scene 5: a detector looks for the pattern ===== */
  const paperLines = (x, y, w, h, idp) => textLines(x + w * 0.14, y + h * 0.13, w * 0.72, 8, h * 0.094, h * 0.034, LINE_W, C.gray, idp);
  s += `<g id="sc5"><g id="cam5">
    <circle cx="1650" cy="160" r="200" fill="#EAF2FC"/>
    <rect x="-200" y="690" width="2320" height="600" fill="${C.white}"/>
    <rect x="-200" y="690" width="2320" height="8" fill="${C.edge}"/>
    <g transform="translate(430 455) rotate(-3)" filter="url(#shadow)">
      <rect x="-135" y="-175" width="270" height="350" rx="14" fill="${C.white}" stroke="${C.edge}" stroke-width="3"/>
      ${paperLines(-135, -175, 270, 350)}
    </g>
    <rect x="1000" y="606" width="60" height="76" fill="#2B4B83"/>
    <rect x="910" y="674" width="240" height="26" rx="13" fill="${C.navy}"/>
    <rect x="700" y="170" width="660" height="440" rx="30" fill="${C.navy}" filter="url(#shadow)"/>
    <rect x="724" y="194" width="612" height="392" rx="16" fill="#EAF3FF"/>
    <g clip-path="url(#screenClip)">
      <rect x="${S5.sx}" y="${S5.sy}" width="${S5.sw}" height="${S5.sh}" rx="10" fill="${C.white}" stroke="${C.edge}" stroke-width="2"/>
      ${paperLines(S5.sx, S5.sy, S5.sw, S5.sh, "s5l")}
      <g id="s5-dots"></g>
      <g id="s5-scan"><rect x="724" y="-60" width="612" height="60" fill="url(#scanGrad)"/><rect x="724" y="-4" width="612" height="7" rx="3" fill="${C.sky}"/></g>
    </g>
    <circle cx="1030" cy="597" r="4" fill="#4E6FA6"/>
    <g id="s5-result" transform="translate(1620 390)">
      <rect x="-200" y="-90" width="400" height="180" rx="26" fill="${C.white}" stroke="${C.purple}" stroke-width="5" filter="url(#shadow)"/>
      <g id="s5-resultText"><text x="0" y="12" text-anchor="middle" font-size="36" font-weight="600" fill="${C.purple}">พบสัญญาณลายน้ำ</text></g>
    </g>
  </g></g>`;

  /* ===== Scene 6: only one piece of the evidence ===== */
  const P = 240;
  const icon = {
    mag: `<circle cx="-10" cy="-10" r="38" fill="none" stroke="#fff" stroke-width="12"/><line x1="18" y1="18" x2="52" y2="52" stroke="#fff" stroke-width="14" stroke-linecap="round"/>`,
    doc: `<rect x="-46" y="-56" width="80" height="104" rx="10" fill="#fff"/><rect x="-32" y="-34" width="50" height="8" rx="4" fill="#9CC4F2"/><rect x="-32" y="-14" width="40" height="8" rx="4" fill="#9CC4F2"/><rect x="-32" y="6" width="46" height="8" rx="4" fill="#9CC4F2"/>
          <g transform="translate(40 18) rotate(35)"><rect x="-8" y="-50" width="16" height="64" rx="3" fill="${C.navy}"/><path d="M-8 14 L0 32 L8 14 Z" fill="#F3D9B1"/></g>`,
    clock: `<circle r="50" fill="none" stroke="#fff" stroke-width="12"/><line x1="0" y1="0" x2="0" y2="-30" stroke="#fff" stroke-width="10" stroke-linecap="round"/><line x1="0" y1="0" x2="22" y2="12" stroke="#fff" stroke-width="10" stroke-linecap="round"/>`,
  };
  const piece = (id, fill, l, r, ic) => `<g id="${id}"><g transform="translate(${-P / 2} ${-P / 2})">
      <path d="${piecePath(P, P, l, r)}" fill="${fill}" stroke="#fff" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/></g>${ic}</g>`;
  s += `<g id="sc6"><g id="cam6">
    <circle cx="260" cy="860" r="260" fill="#EAF2FC"/><circle cx="1720" cy="180" r="200" fill="#EAF2FC"/>
    ${piece("pzB", C.sky, -1, 1, icon.doc)}
    ${piece("pzC", C.yellow, -1, 0, icon.clock)}
    ${piece("pzA", C.purple, 0, 1, icon.mag)}
    <g id="s6-frame"><rect x="-200" y="-90" width="400" height="180" rx="26" fill="${C.white}" stroke="${C.purple}" stroke-width="5"/>
      <g id="s6-frameText"><text x="0" y="12" text-anchor="middle" font-size="36" font-weight="600" fill="${C.purple}">พบสัญญาณลายน้ำ</text></g></g>
  </g></g>`;

  /* ===== Overlays (post-production text) ===== */
  s += `<g id="ov">
    <g id="title"><rect x="460" y="70" width="1000" height="112" rx="56" fill="${C.white}" filter="url(#shadow)"/>
      <circle cx="530" cy="126" r="14" fill="${C.purple}"/><circle cx="530" cy="126" r="28" fill="${C.purple}" opacity=".18"/>
      <text x="990" y="146" text-anchor="middle" font-size="54" font-weight="600" fill="${C.navy}">AI ซ่อนลายน้ำในข้อความอย่างไร?</text></g>
    <g id="tag"><rect x="64" y="56" width="268" height="66" rx="33" fill="${C.navy}" opacity=".9"/>
      <text x="198" y="100" text-anchor="middle" font-size="32" font-weight="500" fill="#fff">ภาพเปรียบเทียบ</text></g>
    <g id="closing">
      <text x="960" y="230" text-anchor="middle" font-size="76" font-weight="600" fill="${C.navy}">
        <tspan>ไม่พบลายน้ำ</tspan><tspan fill="${C.purple}" dx="28">≠</tspan><tspan dx="28">ไม่ได้ใช้ AI</tspan></text></g>
    <g id="cap"><rect id="cap-bg" y="930" height="86" rx="43" fill="${C.navy}" opacity=".88"/>
      <text id="cap-t" x="960" y="987" text-anchor="middle" font-size="42" font-weight="500" fill="#fff"></text></g>
  </g>`;
  svg.innerHTML = s;

  // Scene 5 dots on the screen copy, same pattern as scene 3
  let d = "";
  for (let i = 0; i < S3.n; i++) if (DOT_PATTERN[i]) {
    const ln = $("s5l" + i), x = +ln.getAttribute("x") + +ln.getAttribute("width") * DOT_FRAC[i], y = +ln.getAttribute("y") + +ln.getAttribute("height") / 2;
    d += `<g id="s5d${i}" transform="translate(${x} ${y}) scale(.62)">${dot("s5dd" + i).replace(/^<g id="[^"]+" transform="[^"]+">/, "<g>")}</g>`;
  }
  $("s5-dots").innerHTML = d;
}

/* ---------- narration (voice-over text shown as captions) ---------- */
const CAPS = [
  [0.3, 3.85, "เมื่อเราขอให้ AI ช่วยเขียน…"],
  [4.25, 9.85, "ระบบลายน้ำปรับการเลือกคำเล็กน้อย…"],
  [10.25, 14.85, "จนเกิดรูปแบบที่ซ่อนอยู่ในข้อความ"],
  [15.25, 18.85, "เราอ่านได้ตามปกติ ไม่เห็นลายน้ำ"],
  [19.25, 24.85, "เครื่องมือตรวจที่รองรับ อาจพบร่องรอยนี้"],
  [25.25, 29.9, "แต่ลายน้ำเป็นเพียงหลักฐานส่วนหนึ่ง ไม่ใช่คำตัดสิน"],
];
const SCENES = [[0, 4], [4, 10], [10, 15], [15, 19], [19, 25], [25, 30]];

/* ---------- per-scene render functions ---------- */
function render1(t) {
  cam("cam1", lerp(960, 1150, prog(t, 0.2, 4)), lerp(540, 520, prog(t, 0.2, 4)), lerp(1, 1.22, prog(t, 0.2, 4)));
  // paper slides from student to robot
  const pp = prog(t, 0.35, 1.55), px = lerp(790, 1172, pp), py = lerp(568, 556, pp) - 18 * bump(t, 0.35, 1.55);
  tf("s1-paper", `translate(${px} ${py}) rotate(${lerp(-8, 5, pp)})`);
  // student: right hand follows paper, then lets go and rests
  const follow = clamp((t - 0.35) / 0.75), release = prog(t, 0.95, 1.6);
  const shx = 622, shy = 490;
  let hx = Math.min(px - 54, 760), hy = py + 6;
  hx = lerp(hx, 690, release); hy = lerp(hy, 612, release);
  if (t < 0.35) { hx = 736; hy = 574; }
  setArm("st1-armR", shx, shy, hx, hy);
  setArm("st1-armL", 498, 490, 520, 610);
  // student eyes look right & small happy bob
  tf("st1-eyes", `translate(${6} 0)`);
  tf("st1-head", `translate(0 ${-3 * bump(t, 1.4, 2.0)})`);
  // robot: reaches with left arm, nods, raises pencil with right arm
  const rsLx = 1294, rsLy = 532, rsRx = 1426, rsRy = 532;
  const reach = prog(t, 0.9, 1.45);
  setArm("rb1-armL", rsLx, rsLy, lerp(1278, px + 52, reach), lerp(624, py + 10, reach));
  const lift = prog(t, 2.15, 3.0, back);
  const rhx = lerp(1450, 1372, lift), rhy = lerp(616, 566, lift);
  setArm("rb1-armR", rsRx, rsRy, rhx, rhy);
  tf("rb1-pencil", `translate(${rhx} ${rhy + 6}) rotate(${lerp(10, -40, lift)})`);
  const nod = 10 * bump(t, 1.55, 1.9) + 7 * bump(t, 1.9, 2.25);
  tf("rb1-head", `translate(0 ${nod})`);
  const blink = 1 - 0.9 * bump(t, 3.2, 3.4);
  tf("rb1-eyes", `translate(${-8} -226) scale(1 ${blink}) translate(0 226)`);
}

function cardPos2(g, k, t) {
  // returns {x,y,s,o} for card (g,k)
  const base = { x: S2.gx[g], y: S2.gy[k] };
  const pop = prog(t, 4.25 + (g * 3 + k) * 0.06, 4.75 + (g * 3 + k) * 0.06, back);
  let o = clamp(pop * 2), s = lerp(.6, 1, pop), x = base.x, y = base.y;
  const T = S2.T[g];
  if (k === S2.sel[g]) {
    const lift = bump(t, T - 0.05, T + 1.05);
    const mv = prog(t, T + 0.2, T + 1.0);
    x = lerp(base.x, S2.slotX[g], mv); y = lerp(base.y, S2.slotY, mv) - 30 * lift;
    s *= 1 + 0.08 * lift;
  } else {
    o *= lerp(1, 0.25, prog(t, T + 0.2, T + 0.8));
  }
  return { x, y, s, o };
}
function render2(t) {
  cam("cam2", lerp(940, 985, prog(t, 4, 10, lin)), lerp(520, 560, prog(t, 4, 10, lin)), lerp(1, 1.05, prog(t, 4, 10, lin)));
  for (let g = 0; g < 3; g++) for (let k = 0; k < 3; k++) {
    const c = cardPos2(g, k, t), selActive = k === S2.sel[g] && t > S2.T[g] - 0.05 && t < S2.T[g] + 1.1;
    tf(`c${g}${k}`, `translate(${c.x} ${c.y}) scale(${c.s})`); op(`c${g}${k}`, c.o);
    attr(`c${g}${k}-r`, { stroke: selActive ? C.blue : C.edge });
  }
  // the robot hand travels card → slot for each group
  const off = { x: 1760, y: -160 };
  let hx = off.x, hy = off.y;
  for (let g = 0; g < 3; g++) {
    const T = S2.T[g], k = S2.sel[g], card = { x: S2.gx[g], y: S2.gy[k] };
    const prev = g === 0 ? off : { x: S2.slotX[g - 1], y: S2.slotY };
    if (t >= T - 0.75) {
      const a = prog(t, T - 0.75, T);
      hx = lerp(prev.x, card.x, a); hy = lerp(prev.y - 64, card.y - 64, a);
      if (g === 0) hy = lerp(prev.y, card.y - 64, a);
    }
    if (t >= T) { const c = cardPos2(g, k, t); hx = c.x; hy = c.y - 64 * c.s; }
  }
  if (t > 9.25) { const a = prog(t, 9.25, 9.85, ein); hx = lerp(S2.slotX[2], off.x, a); hy = lerp(S2.slotY - 64, off.y, a); }
  const ax = hx + 520, ay = hy - 700;
  attr("s2-arm", { x1: ax, y1: ay, x2: hx, y2: hy - 30 }); attr("s2-arm-o", { x1: ax, y1: ay, x2: hx, y2: hy - 30 });
  tf("s2-mitt", `translate(${hx} ${hy})`);
  // purple dots appear under some of the chosen words
  for (let g = 0; g < 3; g++) if (S2.dotted[g]) {
    const T = S2.T[g], a = prog(t, T + 1.0, T + 1.4, back);
    tf(`s2-dot${g}`, `translate(${S2.slotX[g]} ${S2.slotY + 82}) scale(${Math.max(0, a)})`); op(`s2-dot${g}`, prog(t, T + 1.0, T + 1.2));
  }
}

function render3(t) {
  cam("cam3", 960, lerp(500, 545, prog(t, 10, 15)), lerp(1.12, 1.0, prog(t, 10, 15)));
  const bgP = prog(t, 11.6, 13.6);
  attr("s3-bg", { fill: mixHex(C.pale, C.cream, bgP) }); op("s3-grid", 0.8 * (1 - bgP));
  const pp = prog(t, 10.1, 10.8);
  tf("s3-paper", `translate(0 ${lerp(70, 0, pp)})`); op("s3-paper", pp);
  op("s3-extra", prog(t, 12.0, 12.5));
  for (let i = 0; i < S3.n; i++) {
    const cx = 960 + (i - 2.5) * S3.gap, cy = S3.rowY;
    const appear = prog(t, 10.0 + i * 0.05, 10.4 + i * 0.05, eout);
    const m = prog(t, 11.0 + i * 0.16, 11.9 + i * 0.16);
    const x = lerp(cx - S3.cw / 2, S3.lx, m), y = lerp(cy - S3.ch / 2, S3.ly + i * S3.lgap, m) - 26 * bump(t, 11.0 + i * 0.16, 11.9 + i * 0.16);
    const w = lerp(S3.cw, S3.lw[i], m), h = lerp(S3.ch, S3.lh, m);
    attr(`s3c${i}-r`, { x, y, width: w, height: h, rx: lerp(18, S3.lh / 2, m), fill: mixHex(C.white, C.gray, m), "stroke-opacity": 1 - m });
    op(`s3c${i}`, appear);
    const inner = 1 - clamp(m * 2.5);
    op(`s3c${i}-in`, inner);
    attr(`s3c${i}-a`, { x: x + 22, y: y + h * 0.3, width: w * 0.55 });
    attr(`s3c${i}-b`, { x: x + 22, y: y + h * 0.58, width: w * 0.38 });
    if (DOT_PATTERN[i]) {
      const dx = lerp(cx, S3.lx + S3.lw[i] * DOT_FRAC[i], m), dy = lerp(cy + 74, S3.ly + i * S3.lgap + S3.lh / 2, m);
      const blinkP = bump(t, 12.55, 13.05);
      const sc = lerp(1, 0.8, m) * (1 + 0.7 * blinkP);
      tf(`s3d${i}`, `translate(${dx} ${dy}) scale(${sc})`);
      op(`s3d${i}`, appear * (1 - prog(t, 13.25, 14.05)));
      const ring = prog(t, 12.55, 13.2, eout);
      attr(`s3d${i}-ring`, { r: 14 + 30 * ring, opacity: (t > 12.55 ? 1 - ring : 0).toFixed(3) });
    }
  }
}

function render4(t) {
  const z = prog(t, 17.05, 18.95);
  cam("cam4", lerp(960, 930, z), lerp(540, 640, z), lerp(1, 1.75, z));
  // student holds the paper, reads top → bottom, then nods
  const read = clamp((t - 15.3) / 1.7);
  const ex = 9 + 4 * Math.sin(read * Math.PI * 6), ey = lerp(-4, 9, read);
  tf("st4-eyes", `translate(${ex} ${ey})`);
  const nod = 9 * bump(t, 16.95, 17.3) + 6 * bump(t, 17.3, 17.6);
  tf("st4-head", `translate(0 ${nod})`);
  const breathe = 2 * Math.sin(t * 3);
  tf("s4-paper", `translate(930 ${655 + breathe}) rotate(-4)`);
  setArm("st4-armL", 619, 692, 806, 800 + breathe);
  setArm("st4-armR", 781, 692, 1066, 752 + breathe);
  // robot hovers calmly and blinks
  const bob = 5 * Math.sin((t - 15) * 2.4);
  tf("rb4w", `translate(1480 ${860 + bob})`);
  setArm("rb4-armL", 1410, 740 + bob, 1392, 836 + bob);
  setArm("rb4-armR", 1550, 740 + bob, 1568, 836 + bob);
  const blink = 1 - 0.9 * (bump(t, 16.1, 16.3) + bump(t, 18.2, 18.4));
  tf("rb4-eyes", `translate(-6 -226) scale(1 ${blink}) translate(0 226)`);
}

function render5(t) {
  cam("cam5", lerp(990, 1010, prog(t, 19, 25, lin)), 470, lerp(1.0, 1.04, prog(t, 19, 25, lin)));
  const sy = lerp(194, 600, prog(t, 19.8, 22.6, lin));
  tf("s5-scan", `translate(0 ${sy})`); op("s5-scan", prog(t, 19.6, 19.85) * (1 - prog(t, 22.5, 22.9)));
  for (let i = 0; i < S3.n; i++) if (DOT_PATTERN[i]) {
    const ln = $("s5l" + i), y = +ln.getAttribute("y");
    const a = clamp((sy - y) / 40);
    op("s5d" + i, a);
    const g = $("s5d" + i), base = g.getAttribute("transform").replace(/ scale\([^)]+\)/, "");
    g.setAttribute("transform", `${base} scale(${0.62 * (0.6 + 0.4 * back(a))})`);
  }
  const r = prog(t, 23.0, 23.6, back);
  tf("s5-result", `translate(1620 390) scale(${Math.max(0.01, r)})`); op("s5-result", prog(t, 23.0, 23.25));
  op("s5-resultText", CAPTIONS ? prog(t, 23.4, 23.8) : 0);
}

function render6(t) {
  cam("cam6", 960, lerp(500, 530, prog(t, 25, 30)), lerp(1.1, 1.0, prog(t, 25, 30)));
  const P = 240, fin = { A: [600 + P / 2, 560], B: [840 + P / 2, 560], C: [1080 + P / 2, 560] };
  // frame → purple piece
  const f = prog(t, 25.0, 25.9);
  const pre = { A: [fin.A[0] - 70, 560], B: [fin.B[0], 600], C: [fin.C[0] + 70, 560] };
  const fx = lerp(1620, pre.A[0], f), fy = lerp(390, pre.A[1], f);
  tf("s6-frame", `translate(${fx} ${fy}) scale(${lerp(1, 0.55, f)})`);
  op("s6-frame", 1 - prog(t, 25.55, 26.0));
  op("s6-frameText", CAPTIONS ? 1 - prog(t, 25.1, 25.5) : 0);
  const asm = prog(t, 27.45, 28.6, back);
  const A = { x: lerp(pre.A[0], fin.A[0], asm), y: lerp(pre.A[1], fin.A[1], asm), r: lerp(-6, 0, asm) };
  const aIn = prog(t, 25.5, 26.1, back);
  tf("pzA", `translate(${f < 1 ? fx : A.x} ${f < 1 ? fy : A.y}) rotate(${A.r}) scale(${Math.max(0.01, aIn)})`); op("pzA", prog(t, 25.5, 25.8));
  const bIn = prog(t, 26.0, 27.0, eout), cIn = prog(t, 26.3, 27.3, eout);
  const B = { x: lerp(pre.B[0], fin.B[0], asm), y: lerp(pre.B[1] + 520 * (1 - bIn), fin.B[1], asm), r: lerp(5, 0, asm) };
  const Cc = { x: lerp(pre.C[0] + 760 * (1 - cIn), fin.C[0], asm), y: lerp(pre.C[1], fin.C[1], asm), r: lerp(7, 0, asm) };
  tf("pzB", `translate(${B.x} ${B.y}) rotate(${B.r})`); op("pzB", prog(t, 26.0, 26.3));
  tf("pzC", `translate(${Cc.x} ${Cc.y}) rotate(${Cc.r})`); op("pzC", prog(t, 26.3, 26.6));
}

/* ---------- master render ---------- */
const sceneFns = [render1, render2, render3, render4, render5, render6];
function render(t) {
  t = clamp(t, 0, DUR);
  SCENES.forEach(([a, b], i) => {
    const fadeIn = i === 0 ? 1 : prog(t, a - 0.18, a + 0.18, lin);
    const fadeOut = i === SCENES.length - 1 ? 1 : 1 - prog(t, b - 0.18, b + 0.18, lin);
    const v = fadeIn * fadeOut;
    const g = $("sc" + (i + 1));
    g.setAttribute("opacity", v.toFixed(3));
    g.style.display = v <= 0.001 ? "none" : "";
    if (v > 0.001) sceneFns[i](t);
  });
  // overlays
  op("title", CAPTIONS ? prog(t, 0.1, 0.6) * (1 - prog(t, 3.3, 3.8)) : 0);
  tf("title", `translate(0 ${lerp(-20, 0, prog(t, 0.1, 0.7, eout))})`);
  op("tag", CAPTIONS ? prog(t, 4.4, 4.8) * (1 - prog(t, 9.6, 9.95)) : 0);
  op("closing", CAPTIONS ? prog(t, 28.3, 28.9) : 0);
  tf("closing", `translate(0 ${lerp(16, 0, prog(t, 28.3, 28.9, eout))})`);
  const cap = CAPTIONS ? CAPS.find(([a, b]) => t >= a && t < b) : null;
  if (cap) {
    const tx = $("cap-t");
    if (tx.textContent !== cap[2]) {
      tx.textContent = cap[2];
      const w = tx.getComputedTextLength() + 96;
      attr("cap-bg", { x: 960 - w / 2, width: w });
    }
    op("cap", prog(t, cap[0], cap[0] + 0.25) * (1 - prog(t, cap[1] - 0.2, cap[1])));
  } else op("cap", 0);
}

/* ---------- playback UI ---------- */
build();
let t0 = performance.now(), cur = 0, playing = !RENDER;
const scrub = $("scrub"), timeEl = $("time"), playBtn = $("play");
function setT(t) { cur = t; render(t); scrub.value = t; timeEl.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)}`; }
function loop(now) {
  if (playing) setT(((now - t0) / 1000) % DUR);
  requestAnimationFrame(loop);
}
playBtn.onclick = () => {
  playing = !playing; playBtn.textContent = playing ? "⏸ หยุด" : "▶ เล่น";
  if (playing) t0 = performance.now() - cur * 1000;
};
scrub.oninput = () => { playing = false; playBtn.textContent = "▶ เล่น"; setT(+scrub.value); };
$("caps").checked = CAPTIONS;
$("caps").onchange = e => { CAPTIONS = e.target.checked; $("cap-t").textContent = ""; render(cur); };
window.__setTime = t => { render(t); };
Promise.all(["500 40px Prompt","600 40px Prompt"].map(f => document.fonts.load(f, "กขAI"))).then(() => document.fonts.ready).then(() => { window.__ready = true; setT(0); t0 = performance.now(); requestAnimationFrame(loop); });
</script>
