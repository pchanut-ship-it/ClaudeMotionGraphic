<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>วันหนึ่งที่ตลาด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap">
<style>
/* =====================================================================
   วันหนึ่งที่ตลาด — เกมฝึกอ่านคำที่มีอักษรนำ ป.1–3 (เวอร์ชัน 1)
   ทุกขนาดใช้หน่วย --u (= 1% ของความสูงเวที 16:9) เวทีจะย่อ/ขยายตามจอ
   ===================================================================== */
:root{
  --u:1vh;
  --ink:#2b1a0c;
  --hi:#b23c06;          /* สีตัวอักษร/คำที่เติมถูก */
  --hi-bg:#fff0c2;
  --wood:#8a5426;
  --wood-dk:#5c3714;
  --paper:#fffaf0;
  --card:#dcebff;        /* บัตรคำทุกใบใช้สีเดียวกัน */
  --card-dk:#1d4478;
  --ok:#14532a;  --ok-bg:#d4f4da;
  --re:#7a2e05;  --re-bg:#ffe4cf;
  --tip:#574100; --tip-bg:#fff4b0;
}
/* จอที่แคบกว่า 16:9 → ใช้ความกว้างเป็นฐาน */
@media (max-aspect-ratio:16/9){ :root{ --u:0.5625vw; } }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#b8741f;}
body{
  font-family:'Mali','Itim','Leelawadee UI','Leelawadee','Thonburi','Noto Sans Thai','Sarabun','Loma','Tahoma',sans-serif;
  color:var(--ink);
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);
  touch-action:none;-ms-touch-action:none;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;color:inherit;margin:0;padding:0;border:0;background:none;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;line-height:inherit;text-align:center;}

/* ---------- เวที 16:9 ---------- */
#app{
  position:absolute;left:50%;top:50%;
  width:calc(var(--u)*177.78);height:calc(var(--u)*100);
  margin-left:calc(var(--u)*-88.89);margin-top:calc(var(--u)*-50);
  overflow:hidden;background-color:#ffc83d;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0, rgba(255,255,255,.16) calc(var(--u)*1.1), rgba(255,255,255,0) calc(var(--u)*1.1), rgba(255,255,255,0) calc(var(--u)*4.4)),
    repeating-linear-gradient(-45deg, rgba(190,110,0,.10) 0, rgba(190,110,0,.10) calc(var(--u)*1.1), rgba(190,110,0,0) calc(var(--u)*1.1), rgba(190,110,0,0) calc(var(--u)*4.4)),
    radial-gradient(ellipse at 50% 40%, #ffe48f 0%, #ffc83d 75%);
}
.awning{position:absolute;left:0;top:0;width:100%;height:calc(var(--u)*9.6);z-index:5;pointer-events:none;}
.awning svg{display:block;width:100%;height:100%;}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;}
.screen.enter{animation:enter .25s ease-out;}
.zone{position:absolute;left:0;width:100%;}
.zA{top:calc(var(--u)*10.5);height:calc(var(--u)*28);}
.zB{top:calc(var(--u)*40);height:calc(var(--u)*27);}
.zC{top:calc(var(--u)*68);height:calc(var(--u)*9.5);}
.zD{top:calc(var(--u)*79);height:calc(var(--u)*19.5);}
.center{display:flex;align-items:center;justify-content:center;}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-0.13em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.ic.solid{fill:currentColor;}

/* ---------- ปุ่มครู (มุมบนขวา) ---------- */
#teacher{position:absolute;top:calc(var(--u)*1);right:calc(var(--u)*1.2);z-index:40;white-space:nowrap;}
.tbtn{display:inline-block;vertical-align:top;margin-left:calc(var(--u)*.8);height:calc(var(--u)*5.4);
  padding:0 calc(var(--u)*1.6);font-size:calc(var(--u)*2.7);font-weight:700;line-height:calc(var(--u)*4.7);
  background:var(--paper);border:calc(var(--u)*.35) solid var(--ink);border-radius:calc(var(--u)*1.4);
  box-shadow:0 calc(var(--u)*.5) 0 var(--ink);cursor:pointer;touch-action:none;}
.tbtn.pressed{transform:translateY(calc(var(--u)*.4));box-shadow:0 calc(var(--u)*.1) 0 var(--ink);}

/* ---------- ป้ายสถานะ (มุมบนซ้าย) ---------- */
.status{position:absolute;top:calc(var(--u)*1);left:calc(var(--u)*1.2);z-index:30;max-width:calc(var(--u)*120);
  background:var(--paper);border:calc(var(--u)*.35) solid var(--ink);border-radius:calc(var(--u)*2);
  padding:0 calc(var(--u)*2);height:calc(var(--u)*6);line-height:calc(var(--u)*5.3);
  font-size:calc(var(--u)*3.4);font-weight:700;white-space:nowrap;overflow:hidden;box-shadow:0 calc(var(--u)*.5) 0 var(--ink);}
.status .sep{margin:0 calc(var(--u)*1);opacity:.5;}

/* ---------- ปุ่มกดแบบนูน ---------- */
.btn{position:relative;display:inline-block;vertical-align:middle;cursor:pointer;touch-action:none;
  border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*3);background:#fff;color:var(--ink);
  font-weight:700;white-space:nowrap;box-shadow:0 calc(var(--u)*1.2) 0 var(--ink);
  transition:transform .08s ease-out, box-shadow .08s ease-out;}
.btn.pressed{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.2) 0 var(--ink);}
.btn.off{opacity:.4;box-shadow:0 calc(var(--u)*.3) 0 var(--ink);transform:translateY(calc(var(--u)*.9));cursor:default;}
.btn-go{background:#8fe39a;}
.btn-next{font-size:calc(var(--u)*7);height:calc(var(--u)*15.5);line-height:calc(var(--u)*14);padding:0 calc(var(--u)*6);}
.btn-next .ic{font-size:.8em;margin-left:.15em;vertical-align:-0.05em;}
.btn-hint{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*1);width:calc(var(--u)*25);height:calc(var(--u)*15);
  background:#ffe36e;font-size:calc(var(--u)*4.8);line-height:calc(var(--u)*13.5);}
.btn-hint .cnt{position:absolute;right:calc(var(--u)*-2);top:calc(var(--u)*-2);width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);line-height:calc(var(--u)*5.6);border-radius:50%;background:var(--ink);color:#fff;font-size:calc(var(--u)*3.6);border:calc(var(--u)*.4) solid #fff;}
.btn-start{font-size:calc(var(--u)*7.5);height:calc(var(--u)*16);line-height:calc(var(--u)*14.5);padding:0 calc(var(--u)*9);}
.btn-teach{font-size:calc(var(--u)*3.8);height:calc(var(--u)*12);line-height:calc(var(--u)*10.6);padding:0 calc(var(--u)*3.5);background:var(--paper);}
.btn-warn{background:#ffd2bd;}
.btn-warn.armed{background:#ff9b73;}
.nextwrap{display:none;position:absolute;left:0;right:0;top:calc(var(--u)*1);text-align:center;}
.nextwrap.show{display:block;}
.nextwrap.show .btn{animation:pop .35s ease-out;}

/* ---------- พื้นผิว: ไม้ / สาน ---------- */
.wood-frame{position:relative;display:inline-block;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*2.6);
  background-color:#b9763a;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0, rgba(255,255,255,.08) calc(var(--u)*.35), rgba(0,0,0,0) calc(var(--u)*.35), rgba(0,0,0,0) calc(var(--u)*1.3)),
    linear-gradient(180deg,#d39556,#a9672f);
  box-shadow:0 calc(var(--u)*1) 0 var(--wood-dk);}
.wood-frame:before,.wood-frame:after{content:"";position:absolute;top:calc(var(--u)*.35);width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border-radius:50%;background:#e9d3b0;box-shadow:inset 0 0 0 calc(var(--u)*.25) #6b3e19;}
.wood-frame:before{left:calc(var(--u)*.6);} .wood-frame:after{right:calc(var(--u)*.6);}
.sign-face{background:var(--paper);border-radius:calc(var(--u)*1.6);box-shadow:inset 0 0 0 calc(var(--u)*.35) #e3c393;text-align:center;}
.woven{display:inline-block;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*3);
  background-color:#d6a253;
  background-image:repeating-linear-gradient(45deg, rgba(110,62,20,.38) 0, rgba(110,62,20,.38) calc(var(--u)*.7), rgba(0,0,0,0) calc(var(--u)*.7), rgba(0,0,0,0) calc(var(--u)*1.4)),
    repeating-linear-gradient(-45deg, rgba(255,240,205,.35) 0, rgba(255,240,205,.35) calc(var(--u)*.7), rgba(0,0,0,0) calc(var(--u)*.7), rgba(0,0,0,0) calc(var(--u)*1.4));
  box-shadow:0 calc(var(--u)*.9) 0 #7a4a1f;}

/* ---------- ตัวอักษร (ด่าน 1) ---------- */
.tiles{position:absolute;left:calc(var(--u)*30);right:calc(var(--u)*30);top:calc(var(--u)*.5);text-align:center;white-space:nowrap;}
.tile{position:relative;display:inline-block;vertical-align:middle;width:calc(var(--u)*16.5);height:calc(var(--u)*16.5);
  margin:0 calc(var(--u)*3);border:calc(var(--u)*.55) solid var(--ink);border-radius:calc(var(--u)*3);
  background:var(--paper);box-shadow:0 calc(var(--u)*1.3) 0 #7a4a1f;
  font-size:calc(var(--u)*11);font-weight:700;line-height:calc(var(--u)*15);color:var(--ink);
  cursor:pointer;touch-action:none;transition:transform .08s ease-out, box-shadow .08s ease-out, opacity .2s;}
.tile.pressed{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.3) 0 #7a4a1f;}
.tile .xb{display:none;position:absolute;right:calc(var(--u)*-1.6);top:calc(var(--u)*-1.6);width:calc(var(--u)*5.6);height:calc(var(--u)*5.6);
  border-radius:50%;background:#fff;border:calc(var(--u)*.4) solid var(--ink);font-size:calc(var(--u)*3.4);line-height:calc(var(--u)*4.6);}
.tile.dim{opacity:.35;box-shadow:0 calc(var(--u)*.3) 0 #7a4a1f;cursor:default;}
.tile.dim .xb{display:block;}

/* ---------- บัตรคำ (ด่าน 2) ---------- */
.bank{position:absolute;left:calc(var(--u)*30);right:calc(var(--u)*3);top:calc(var(--u)*1.2);height:calc(var(--u)*16);
  text-align:center;white-space:nowrap;font-size:calc(var(--u)*6.4);}
.card{position:relative;display:inline-block;vertical-align:top;margin:0 calc(var(--u)*1.3);padding:0 .5em;
  height:calc(var(--u)*14);line-height:calc(var(--u)*12.8);font-size:1em;font-weight:700;color:var(--ink);
  border:calc(var(--u)*.5) solid var(--card-dk);border-radius:calc(var(--u)*2.6);background:var(--card);
  box-shadow:0 calc(var(--u)*1.2) 0 var(--card-dk);cursor:pointer;touch-action:none;white-space:nowrap;
  transition:transform .08s ease-out, box-shadow .08s ease-out;}
.card.pressed{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.2) 0 var(--card-dk);}

/* สถานะร่วมของตัวที่ลากได้ */
.ghost{opacity:.25 !important;}
.gone{visibility:hidden !important;}
.shake{animation:shake .45s ease-in-out;}
.removed,.removed.shake{animation:popout .35s ease-in forwards;pointer-events:none;}
.clone{position:fixed;z-index:60;pointer-events:none;margin:0 !important;transition:none;}
.clone.dragging{box-shadow:0 calc(var(--u)*2.2) calc(var(--u)*1.5) rgba(0,0,0,.28) !important;}

/* ---------- ป้าย + ช่องว่าง (ด่าน 1) ---------- */
.sign-wrap{position:relative;display:inline-block;max-width:calc(var(--u)*165);}
.sign-face.l1{padding:calc(var(--u)*.4) calc(var(--u)*6) calc(var(--u)*.8);min-width:calc(var(--u)*72);}
.sign-word{font-size:calc(var(--u)*12.5);line-height:1.42;font-weight:700;white-space:nowrap;}
.sign-read{font-size:calc(var(--u)*4.6);line-height:1.25;font-weight:600;visibility:hidden;}
.sign-read.show{visibility:visible;animation:fbpop .3s ease-out;}
.sign-read b{color:var(--hi);}
.slot{position:relative;display:inline-block;vertical-align:baseline;min-width:.8em;margin:0 .05em;padding:0 .07em;
  line-height:1.12;border:.05em dashed var(--wood);border-radius:.14em;background:#fff;text-align:center;}
.slot .ch{visibility:hidden;}
.slot.filled{border-style:solid;border-color:var(--hi);background:var(--hi-bg);animation:pop .35s ease-out;}
.slot.filled .ch{visibility:visible;color:var(--hi);}
.slot.hinted{box-shadow:0 0 0 .08em #ffc21a;animation:pulse .8s ease-in-out 3;}
.slot.drop-hover,.blank.drop-hover{border-style:solid;border-color:var(--card-dk);background:#cfe3ff;}
.big-check{display:none;position:absolute;right:calc(var(--u)*-5);top:calc(var(--u)*-5);width:calc(var(--u)*13);height:calc(var(--u)*13);
  border-radius:50%;background:#1f8a3c;color:#fff;border:calc(var(--u)*.7) solid #fff;box-shadow:0 0 0 calc(var(--u)*.45) var(--ink);
  font-size:calc(var(--u)*8.4);line-height:calc(var(--u)*11.4);text-align:center;}
.big-check.show{display:block;animation:pop .45s ease-out;}
.big-check .ic{stroke-width:3.6;vertical-align:-0.08em;}

/* ภาพด้านบน (ด่าน 1) */
.pic{width:calc(var(--u)*42);height:calc(var(--u)*24);border-radius:calc(var(--u)*2);background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pic-emo{font-size:calc(var(--u)*16.5);line-height:1.12;}
.pic.cap .pic-emo{font-size:calc(var(--u)*13.5);}
.pic-cap{font-size:calc(var(--u)*4.4);font-weight:700;line-height:1.3;}
.keeper{position:absolute;left:calc(var(--u)*4);top:calc(var(--u)*3);width:calc(var(--u)*50);}
.keeper-face{float:left;font-size:calc(var(--u)*12);line-height:1.1;}
.bubble{position:relative;display:block;margin-left:calc(var(--u)*15);margin-top:calc(var(--u)*1);padding:calc(var(--u)*1.4) calc(var(--u)*2);
  background:var(--paper);border:calc(var(--u)*.35) solid var(--ink);border-radius:calc(var(--u)*2.4);
  font-size:calc(var(--u)*3.6);font-weight:600;line-height:1.4;}
.progress{position:absolute;right:calc(var(--u)*4);top:calc(var(--u)*5);width:calc(var(--u)*46);text-align:center;}
.pb{display:inline-block;width:calc(var(--u)*7);height:calc(var(--u)*6);margin:0 calc(var(--u)*.5);border-radius:calc(var(--u)*1);
  border:calc(var(--u)*.35) solid var(--ink);background:rgba(255,250,240,.65);font-size:calc(var(--u)*3.4);line-height:calc(var(--u)*5.2);font-weight:700;}
.pb.done{background:#1f8a3c;color:#fff;}
.pb.now{background:var(--paper);box-shadow:0 0 0 calc(var(--u)*.5) var(--ink);}
.progress-txt{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*3.4);font-weight:700;}

/* ---------- แถบผลตอบ ---------- */
.fb{display:inline-block;visibility:hidden;max-width:96%;white-space:nowrap;overflow:hidden;
  font-size:calc(var(--u)*4.7);font-weight:700;line-height:1.35;padding:calc(var(--u)*.8) calc(var(--u)*3);
  border-radius:calc(var(--u)*5);border:calc(var(--u)*.4) solid var(--ink);background:#fff;}
.fb.show{visibility:visible;animation:fbpop .25s ease-out;}
.fb .ic{font-size:1.2em;margin-right:.3em;stroke-width:3.4;}
.fb .emo{margin-right:.3em;}
.fb-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);}
.fb-re{background:var(--re-bg);color:var(--re);border-color:var(--re);}
.fb-tip{background:var(--tip-bg);color:var(--tip);border-color:var(--tip);}
.hi{color:var(--hi);}
.hl{color:var(--hi);font-weight:700;background:var(--hi-bg);border-bottom:.07em solid var(--hi);border-radius:.12em;padding:0 .06em;}

/* ---------- ฉาก + ประโยค (ด่าน 2) ---------- */
.scene{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*25);border-radius:calc(var(--u)*2);overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:#fff6dc;}
.scene-in{white-space:nowrap;}
.sc{display:inline-block;font-size:calc(var(--u)*16);line-height:1.15;margin:0 calc(var(--u)*2);}
.scene.happy .sc{animation:hop .7s ease-out 1;}
.scene.happy .sc:nth-child(2){animation-delay:.12s;}
.scene.happy .sc:nth-child(3){animation-delay:.24s;}
.scene.happy .sc:nth-child(4){animation-delay:.36s;}
.scene.run .scene-in{animation:runby 1.3s ease-in-out 1;}
.bg-sky{background:linear-gradient(180deg,#bfe6ff,#fff4c9);}
.bg-market{background:linear-gradient(180deg,#ffe9c2,#fff8e6);}
.bg-veg{background:linear-gradient(180deg,#d8f5c8,#fdfbe7);}
.bg-pink{background:linear-gradient(180deg,#ffe0e6,#fff6ea);}
.bg-sun{background:linear-gradient(180deg,#fff0a8,#fffbe6);}
.bg-park{background:linear-gradient(180deg,#d4efff,#e3f7d2);}
.bg-book{background:linear-gradient(180deg,#eadfff,#fff7ea);}
.pageno{position:absolute;right:calc(var(--u)*7);top:calc(var(--u)*9);font-size:calc(var(--u)*4);font-weight:700;
  background:var(--paper);border:calc(var(--u)*.35) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*.5) calc(var(--u)*2);}
.sbox{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);top:0;bottom:0;padding:0 calc(var(--u)*3);
  display:flex;align-items:center;justify-content:center;background:#fffdf6;
  border:calc(var(--u)*.5) solid var(--wood);border-radius:calc(var(--u)*2.6);box-shadow:0 calc(var(--u)*.9) 0 var(--wood);}
.sentence{width:100%;max-height:100%;overflow:hidden;text-align:center;font-weight:600;line-height:1.95;font-size:calc(var(--u)*6.6);
  word-wrap:break-word;overflow-wrap:break-word;}
.blank{position:relative;display:inline-block;vertical-align:baseline;min-width:3.1em;margin:0 .1em;padding:0 .2em;line-height:1.45;
  border:.06em dashed var(--wood);border-radius:.2em;background:#fff;text-align:center;cursor:pointer;touch-action:none;}
.blank .bw{visibility:hidden;}
.blank.active{border:.09em solid var(--card-dk);background:#e6f0ff;}
.blank.active .bw{visibility:visible;color:var(--card-dk);font-weight:700;}
.blank.filled{min-width:0;border:.06em solid var(--hi);background:var(--hi-bg);cursor:default;}
.blank.filled .bw{visibility:visible;color:var(--hi);font-weight:700;}
.blank.justin{animation:pop .35s ease-out;}
.clue.on{background:#fff07a;border-bottom:.1em solid #9a6b00;border-radius:.12em;box-shadow:0 0 0 .08em #fff07a;}

/* ---------- หน้าแรก: แผนที่ตลาด ---------- */
.title-board{position:absolute;left:calc(var(--u)*5);top:calc(var(--u)*12);}
.title-board .sign-face{padding:calc(var(--u)*1.2) calc(var(--u)*4.5) calc(var(--u)*1.6);}
.title-main{font-size:calc(var(--u)*8.6);font-weight:700;line-height:1.25;white-space:nowrap;}
.title-sub{font-size:calc(var(--u)*3.6);font-weight:600;line-height:1.3;}
.rope{position:absolute;top:calc(var(--u)*-3.4);width:calc(var(--u)*.6);height:calc(var(--u)*4);background:#6b3e19;}
.basket-wrap{position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*11);width:calc(var(--u)*66);height:calc(var(--u)*27);}
.basket-handle{position:absolute;left:20%;right:20%;top:calc(var(--u)*1.5);height:calc(var(--u)*18);
  border:calc(var(--u)*1.5) solid #8a5426;border-bottom:none;border-radius:calc(var(--u)*14) calc(var(--u)*14) 0 0;}
.basket-items{position:absolute;left:0;right:0;top:calc(var(--u)*4.5);text-align:center;white-space:nowrap;}
.bitem{display:inline-block;font-size:calc(var(--u)*11);line-height:1.1;margin:0 calc(var(--u)*.5);}
.bitem.wait{visibility:hidden;}
.bitem.land{animation:pop .45s ease-out;}
.basket{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*14);
  border:calc(var(--u)*.6) solid #6b3e19;border-radius:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*7) calc(var(--u)*7);
  background-color:#c98b3c;
  background-image:repeating-linear-gradient(90deg, rgba(90,50,10,.38) 0, rgba(90,50,10,.38) calc(var(--u)*.7), rgba(0,0,0,0) calc(var(--u)*.7), rgba(0,0,0,0) calc(var(--u)*3)),

(function () {

  var L1 = null;
  function l1Pool() {
    var out = [];
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i], k = w.blank ? w.blank.indexOf('_') : -1;
      if (k < 0) continue;
      var ans = w.word.charAt(k);
      if (w.blank.slice(0, k) + ans + w.blank.slice(k + 1) !== w.word) continue;   // ข้ามข้อมูลที่พิมพ์ไม่ตรงกัน
      out.push({ w: w, ans: ans, before: w.blank.slice(0, k), after: w.blank.slice(k + 1) });
    }
    return out;
  }
  function startLevel1() {
    var pool = shuffle(l1Pool()).slice(0, LEVEL1_QUESTIONS);
    for (var i = 0; i < pool.length; i++) {
      var q = pool[i], others = [];
      for (var j = 0; j < LETTER_CHOICES.length; j++) { if (LETTER_CHOICES[j] !== q.ans) others.push(LETTER_CHOICES[j]); }
      q.tiles = shuffle([q.ans].concat(shuffle(others).slice(0, 2)));
    }
    L1 = { qs: pool, i: 0 };
    stats.rounds.l1++;
    stats.l1 = { finished: false, total: pool.length, items: [] };
    saveStats();
    renderL1();
  }

    var prog = '';

  function l1Attempt(tile, clone) {

  /* =====================================================================

     ===================================================================== */
  var L2 = null;
  /* แปลงประโยค: {คำ} = ช่องว่าง, [คำ] = คำใบ้ของช่องถัดไป */
  function parseStory(text) {
    var tokens = [], blanks = [], re = /\{([^}]*)\}|\[([^\]]*)\]/g, m, last = 0, nClue = 0, pending = -1, lastClue = -1;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) tokens.push({ t: 'text', v: text.slice(last, m.index) });
      if (m[0].charAt(0) === '{') {
        var clue = pending >= 0 ? pending : lastClue;
        if (clue < 0 && tokens.length && tokens[tokens.length - 1].t === 'text') {
          var tk = tokens[tokens.length - 1];   // ไม่มี [ ] → ใช้ข้อความก่อนช่องเป็นคำใบ้
          tk.t = 'clue'; tk.ci = nClue++; clue = lastClue = tk.ci;
        }
        tokens.push({ t: 'blank', bi: blanks.length });
        blanks.push({ answer: m[0].slice(1, -1).replace(/^\s+|\s+$/g, ''), clue: clue });
        pending = -1;
      } else {
        tokens.push({ t: 'clue', v: m[0].slice(1, -1), ci: nClue });
        pending = lastClue = nClue++;
      }
      last = re.lastIndex;
    }
    if (last < text.length) tokens.push({ t: 'text', v: text.slice(last) });
    return { tokens: tokens, blanks: blanks };
  }
  function totalBlanks() { var n = 0; for (var i = 0; i < STORY.length; i++) n += parseStory(STORY[i].text).blanks.length; return n; }
  function startLevel2() {
    L2 = { p: 0, placed: [] };
    stats.rounds.l2++;
    stats.l2 = { finished: false, total: totalBlanks(), pages: [] };
    saveStats();
    renderL2();
  }
  function renderL2() {
    var page = STORY[L2.p], parsed = parseStory(page.text), i, tk;
    L2.page = page; L2.blanks = parsed.blanks; L2.hint = 0; L2.done = false; L2.active = -1;
    var answers = [];
    for (i = 0; i < parsed.blanks.length; i++) { parsed.blanks[i].filled = false; parsed.blanks[i].word = null; answers.push(parsed.blanks[i].answer); }
    L2.rec = { page: L2.p + 1, hint: 0, done: false, blanks: [] };
    for (i = 0; i < answers.length; i++) L2.rec.blanks.push({ word: answers[i], wrong: 0, firstTry: false, done: false });
    stats.l2.pages[L2.p] = L2.rec;
    saveStats();

    var sent = '';
    for (i = 0; i < parsed.tokens.length; i++) {
      tk = parsed.tokens[i];
      if (tk.t === 'text') sent += esc(tk.v);
      else if (tk.t === 'clue') sent += '<span class="clue" id="c' + tk.ci + '">' + esc(tk.v) + '</span>';
      else sent += '<span class="blank" id="b' + tk.bi + '" role="button" aria-label="ช่องว่างที่ ' + (tk.bi + 1) + '"><span class="bw">?</span></span>';
    }
    var bankItems = [];
    for (i = 0; i < answers.length; i++) bankItems.push({ w: answers[i], x: false });
    if (page.extra) bankItems.push({ w: page.extra, x: true });
    bankItems = shuffle(bankItems);
    var cards = '';
    for (i = 0; i < bankItems.length; i++) {
      cards += '<button class="card" data-w="' + esc(bankItems[i].w) + '"' + (bankItems[i].x ? ' data-x="1"' : '') + '>' + esc(bankItems[i].w) + '</button>';
    }
    var sc = '', scene = page.scene || [];
    for (i = 0; i < scene.length; i++) sc += '<span class="sc">' + scene[i] + '</span>';

    var html =
      '<div class="zone zA center"><div class="woven"><div class="scene bg-' + (page.bg || 'market') + '" id="scene"><div class="scene-in">' + sc + '</div></div></div>' +
        '<div class="pageno">หน้า ' + (L2.p + 1) + ' / ' + STORY.length + '</div></div>' +
      '<div class="zone zB"><div class="sbox"><div class="sentence" id="sentence">' + sent + '</div></div></div>' +
      '<div class="zone zC center"><div class="fb" id="fb" role="status" aria-live="polite"></div></div>' +
      '<div class="zone zD">' +
        '<button class="btn btn-hint" id="btnHint">💡 คำใบ้<span class="cnt" id="hintCnt">2</span></button>' +
        '<div class="bank" id="bank">' + cards + '</div>' +
        '<div class="nextwrap" id="nextWrap"><button class="btn btn-next btn-go" id="btnNext">ไปต่อ ' + IC.next + '</button></div>' +
      '</div>';
    setScreen(html, 'l2', '📖 ร้านหนังสือ<span class="sep">·</span>นิทาน หน้า ' + (L2.p + 1) + ' / ' + STORY.length);

    for (i = 0; i < L2.blanks.length; i++) {
      L2.blanks[i].el = $('b' + i);
      (function (bi) {
        onTap(L2.blanks[bi].el, function () { if (!busy && !L2.done && !L2.blanks[bi].filled) l2SetActive(bi); });
      })(i);
    }
    var cardEls = $('bank').querySelectorAll('.card');
    for (i = 0; i < cardEls.length; i++) {
      makeDraggable(cardEls[i], {
        canUse: function (el) { return !L2.done && L2.active >= 0 && !hasCls(el, 'gone') && !hasCls(el, 'removed'); },
        tap: function (el) { l2Attempt(el, null, L2.active); },
        drop: function (el, c, t) { l2Attempt(el, c, t.bi); },
        targets: function () {
          var out = [];
          for (var k = 0; k < L2.blanks.length; k++) { if (!L2.blanks[k].filled) out.push({ el: L2.blanks[k].el, margin: 2.5, bi: k }); }
          return out;
        }
      });
    }
    onTap($('btnHint'), l2Hint);
    onTap($('btnNext'), l2Next);
    l2SetActive(0);
    l2UpdateHint();
    currentFit = function () { fitText($('sentence'), 6.8, 5, 'h'); fitText($('bank'), 6.4, 4.4, 'w'); };
    currentFit();
  }
  function l2SetActive(bi) {
    L2.active = bi;
    for (var i = 0; i < L2.blanks.length; i++) setCls(L2.blanks[i].el, 'active', i === bi && !L2.blanks[i].filled);
    l2ShowClue();
  }
  function l2ShowClue() {
    var list = $('sentence').querySelectorAll('.clue');
    for (var i = 0; i < list.length; i++) rmCls(list[i], 'on');
    if (L2.hint >= 1 && L2.active >= 0 && !L2.done) {
      var ci = L2.blanks[L2.active].clue;
      if (ci >= 0) addCls($('c' + ci), 'on');
    }
  }
  function l2Fits(bi, word) {
    var b = L2.blanks[bi];
    if (!L2.page.anyOrder) return word === b.answer;
    var remaining = [], i, k;
    for (i = 0; i < L2.blanks.length; i++) remaining.push(L2.blanks[i].answer);
    for (i = 0; i < L2.blanks.length; i++) {
      if (L2.blanks[i].filled) { k = remaining.indexOf(L2.blanks[i].word); if (k >= 0) remaining.splice(k, 1); }
    }
    return remaining.indexOf(word) >= 0;
  }
  function l2Attempt(card, clone, bi) {
    var b = L2.blanks[bi];
    if (L2.done || busy || !b || b.filled) { if (clone) flyHome(card, clone); return; }
    if (bi !== L2.active) l2SetActive(bi);
    var word = card.getAttribute('data-w'), ok = l2Fits(bi, word);
    busy = true;
    if (!clone) { clone = makeClone(card); addCls(card, 'ghost'); }
    var to = deltaTo(clone, b.el);
    flyTo(clone, to.x, to.y, D(260), function () {
      if (ok) {
        removeEl(clone); rmCls(card, 'ghost'); addCls(card, 'gone');
        busy = false;
        l2Fill(bi, word);
      } else {
        L2.rec.blanks[bi].wrong++;
        saveStats();
        feedback('re', 'อ่านประโยคอีกครั้งนะ');
        restartAnim(b.el, 'shake');
        flyTo(clone, 0, 0, D(300), function () {
          removeEl(clone); rmCls(card, 'ghost'); restartAnim(card, 'shake');
          busy = false;
        });
      }
    });
  }
  function l2Fill(bi, word) {
    var b = L2.blanks[bi], r = L2.rec.blanks[bi], i;
    b.filled = true; b.word = word;
    r.word = word; r.done = true; r.firstTry = r.wrong === 0;
    addWrong(word, 'l2', r.wrong);
    saveStats();
    b.el.firstChild.innerHTML = esc(word);
    rmCls(b.el, 'active'); rmCls(b.el, 'shake'); addCls(b.el, 'filled'); restartAnim(b.el, 'justin');
    b.el.setAttribute('aria-label', word);
    var next = -1;
    for (i = 1; i <= L2.blanks.length; i++) {
      var k = (bi + i) % L2.blanks.length;
      if (!L2.blanks[k].filled) { next = k; break; }
    }
    if (next < 0) { l2PageDone(word); return; }
    feedback('ok', '<b class="hi">' + esc(word) + '</b> อ่านว่า <b>' + esc(readOf(word)) + '</b>');
    l2SetActive(next);
    if (currentFit) currentFit();
  }
  function l2PageDone(lastWord) {
    L2.done = true; L2.active = -1;
    L2.rec.done = true;
    var placed = [];
    for (var i = 0; i < L2.blanks.length; i++) placed.push(L2.blanks[i].word);
    L2.placed[L2.p] = placed;
    saveStats();
    l2ShowClue();
    feedback('ok', '<b class="hi">' + esc(lastWord) + '</b> อ่านว่า <b>' + esc(readOf(lastWord)) + '</b> · ครบแล้ว! อ่านประโยคพร้อมกันนะ');
    $('btnHint').style.display = 'none';
    $('bank').style.display = 'none';
    restartAnim($('scene'), L2.page.anim === 'run' ? 'run' : 'happy');
    if (currentFit) currentFit();
    later(function () { lockTaps(300); addCls($('nextWrap'), 'show'); }, D(900));
  }
  function l2Distractor() {
    var list = $('bank').querySelectorAll('.card');
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute('data-x') === '1' && !hasCls(list[i], 'removed') && !hasCls(list[i], 'gone')) return list[i];
    }
    return null;
  }
  function l2UpdateHint() {
    var b = $('btnHint'); if (!b) return;
    var left = 2 - L2.hint, can = !L2.done && left > 0 && !(L2.hint === 1 && !l2Distractor());
    $('hintCnt').innerHTML = can ? left : 0;
    setCls(b, 'off', !can);
  }
  function l2Hint() {
    if (L2.done || busy) return;
    if (L2.hint === 0) {
      L2.hint = 1;
      l2ShowClue();
      feedback('tip', 'อ่านคำที่ขีดเส้นใต้ แล้วเลือกคำที่เข้ากัน');
    } else if (L2.hint === 1) {
      var x = l2Distractor();
      if (!x) return;
      L2.hint = 2;
      removeChoice(x);
      feedback('tip', 'เอาบัตรคำที่ไม่ใช่ออกไปแล้ว 1 ใบ');
    }
    L2.rec.hint = Math.max(L2.rec.hint, L2.hint);
    saveStats();
    l2UpdateHint();
  }
  function l2Next() {
    if (!L2.done) return;
    L2.p++;
    if (L2.p < STORY.length) { renderL2(); return; }
    stats.l2.finished = true;
    var first = !stats.done.story;
    stats.done.story = true;
    if (first) pendingReward = 'story';
    saveStats();
    showStoryBook(first);
  }
  function showStoryBook(first) {
    var lines = '', p, i, shop = shopById('story');
    for (p = 0; p < STORY.length; p++) {
      var parsed = parseStory(STORY[p].text), placed = L2.placed[p] || [], s = '';
      for (i = 0; i < parsed.tokens.length; i++) {
        var tk = parsed.tokens[i];
        if (tk.t === 'blank') s += '<span class="hl">' + esc(placed[tk.bi] || parsed.blanks[tk.bi].answer) + '</span>';
        else s += esc(tk.v);
      }
      lines += '<p class="sline">' + s + '</p>';
    }
    var html =
      '<div class="book"><div class="story" id="story">' + lines + '</div></div>' +
      '<div class="book-note">👩‍🏫 ครูให้นักเรียนอ่านออกเสียงพร้อมกัน</div>' +
      '<div class="story-foot"><button class="btn btn-next btn-go" id="btnMap" style="font-size:calc(var(--u)*5.6);height:calc(var(--u)*12);line-height:calc(var(--u)*10.6)">กลับแผนที่ ' + IC.next + '</button></div>';
    setScreen(html, 'story', '📖 นิทานของเรา: วันหนึ่งที่ตลาด<span class="sep">·</span>' +
      (first ? 'ได้ ' + shop.reward.icon + ' ' + esc(shop.reward.name) + ' แล้ว' : 'อ่านจบอีกรอบแล้ว'));
    onTap($('btnMap'), showHome);
    currentFit = function () { fitText($('story'), 6.4, 3.4, 'h'); };
    currentFit();
  }

  /* =====================================================================
     ส่วนที่ 10 : สรุปผลสำหรับครู
     ===================================================================== */
  function chip(cls, html) { return '<span class="chip ' + cls + '">' + html + '</span>'; }
  function hintMark(h) { return h ? ' <small>💡' + h + '</small>' : ''; }
  function reviewList(lvl) {
    var arr = [], w;
    for (w in stats.wrong) {
      if (stats.wrong.hasOwnProperty(w) && stats.wrong[w][lvl] > 0) arr.push({ w: w, n: stats.wrong[w][lvl] });
    }
    arr.sort(function (a, b) { return b.n - a.n; });
    if (!arr.length) return '<div>ไม่มี</div>';
    var s = '';
    for (var i = 0; i < arr.length; i++) s += chip('re', esc(arr[i].w) + ' <small>(' + esc(readOf(arr[i].w)) + ')</small> ×' + arr[i].n);
    return '<div>' + s + '</div>';
  }
  function scoreBlock(ft, total, unit) {
    var pct = total ? Math.round(ft / total * 100) : 0;
    return '<div class="score"><span class="big">' + ft + '</span><span class="of"> / ' + total + '</span> ' + unit + ' ตอบถูกตั้งแต่ครั้งแรก</div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>';
  }
  function panelL1() {
    var d = stats.l1, h = '<div class="panel p1" id="p1"><div class="ph">🪧 ทักษะ: เติมตัวอักษรนำ<span class="ph-sub">ด่าน 1 · ร้านซ่อมป้าย</span></div>';
    var items = [], i;
    if (d && d.items) { for (i = 0; i < d.items.length; i++) { if (d.items[i]) items.push(d.items[i]); } }
    if (!items.length) return h + '<div class="empty">ยังไม่ได้เล่น</div></div>';
    var ft = 0, chips = '', hints = '';
    for (i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.done && it.firstTry) { ft++; chips += chip('ok', IC.check + esc(it.word) + hintMark(it.hint)); }
      else if (it.done) chips += chip('re', IC.retry + esc(it.word) + ' <small>ผิด ' + it.wrong + '</small>' + hintMark(it.hint));
      else chips += chip('wait', esc(it.word) + ' <small>ยังไม่ตอบ</small>' + hintMark(it.hint));
      if (it.hint) hints += chip('tip', esc(it.word) + ' <small>💡 ขั้น ' + it.hint + '</small>');
    }
    h += scoreBlock(ft, d.total || items.length, 'ข้อ');
    h += '<div class="meta">รอบล่าสุด' + (d.finished ? '' : ' (ยังเล่นไม่จบ)') + ' · เล่นทั้งหมด ' + stats.rounds.l1 + ' รอบ</div>';
    h += '<div class="sec">ผลรายข้อ</div><div>' + chips + '</div>';
    h += '<div class="sec">💡 ข้อที่ใช้คำใบ้</div><div>' + (hints || 'ไม่ได้ใช้') + '</div>';
    h += '<div class="sec">คำที่ควรทบทวน <small>(ตอบผิดสะสม)</small></div>' + reviewList('l1');
    return h + '</div>';
  }
  function panelL2() {
    var d = stats.l2, h = '<div class="panel p2" id="p2"><div class="ph">📖 ทักษะ: ใช้คำในประโยค<span class="ph-sub">ด่าน 2 · ร้านหนังสือ</span></div>';
    var pages = [], i, j;
    if (d && d.pages) { for (i = 0; i < d.pages.length; i++) { if (d.pages[i]) pages.push(d.pages[i]); } }
    if (!pages.length) return h + '<div class="empty">ยังไม่ได้เล่น</div></div>';
    var ft = 0, rows = '';
    for (i = 0; i < pages.length; i++) {
      var pg = pages[i], row = '<div class="prow"><span class="pno">หน้า ' + pg.page + '</span>';
      for (j = 0; j < pg.blanks.length; j++) {
        var b = pg.blanks[j];
        if (b.done && b.firstTry) { ft++; row += chip('ok', IC.check + esc(b.word)); }
        else if (b.done) row += chip('re', IC.retry + esc(b.word) + ' <small>×' + b.wrong + '</small>');
        else row += chip('wait', esc(b.word));
      }
      if (pg.hint) row += chip('tip', '💡ขั้น ' + pg.hint);
      rows += row + '</div>';
    }
    h += scoreBlock(ft, d.total || totalBlanks(), 'ช่อง');
    h += '<div class="meta">รอบล่าสุด' + (d.finished ? '' : ' (ยังเล่นไม่จบ)') + ' · เล่นทั้งหมด ' + stats.rounds.l2 + ' รอบ</div>';
    h += '<div class="sec">ผลรายหน้า <small>(💡 = หน้าที่ใช้คำใบ้)</small></div>' + rows;
    h += '<div class="sec">คำที่ควรทบทวน <small>(ตอบผิดสะสม)</small></div>' + reviewList('l2');
    return h + '</div>';
  }
  function showSummary() {
    var html =
      '<div class="sum">' + panelL1() + panelL2() + '</div>' +
      '<div class="sum-note">' + (storageWorks() ? 'บันทึกผลไว้ในเครื่องนี้แล้ว' : 'เครื่องนี้บันทึกผลไม่ได้ — ผลจะหายเมื่อปิดหน้า') + '</div>' +
      '<div class="sum-foot">' +
        '<button class="btn btn-warn" id="btnReset">' + IC.retry + ' <span id="resetTxt">เล่นใหม่ทั้งหมด</span></button>' +
        '<button class="btn btn-go" id="btnBack">กลับแผนที่ ' + IC.next + '</button>' +
      '</div>';
    setScreen(html, 'summary', '📋 สรุปผลสำหรับครู');
    var armed = false, armTimer = null;
    onTap($('btnReset'), function (el) {
      if (!armed) {
        armed = true; addCls(el, 'armed');
        $('resetTxt').innerHTML = 'แตะอีกครั้งเพื่อลบผลทั้งหมด';
        armTimer = later(function () { armed = false; rmCls(el, 'armed'); $('resetTxt').innerHTML = 'เล่นใหม่ทั้งหมด'; }, 4000);
        return;
      }
      clearTimeout(armTimer);
      stats = freshStats();
      pendingReward = null; L1 = null; L2 = null;
      saveStats();
      showSummary();
    });
    onTap($('btnBack'), showHome);
    currentFit = function () { fitText($('p1'), 3.4, 2.2, 'hw'); fitText($('p2'), 3.4, 2.2, 'hw'); };
    currentFit();
  }

  /* =====================================================================
     เริ่มเกม
     ===================================================================== */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (currentFit) currentFit(); }, 150);
  }, false);
  buildShell();
  showHome();
  try {
    if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
      document.fonts.ready.then(function () { if (currentFit) currentFit(); });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
